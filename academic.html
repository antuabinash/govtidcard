<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elementary Academic Calendar</title>
<style>
    :root {
        --bg: #f5f6fa;
        --ink: #182230;
        --blue: #315de8;
        --line: #e7eaf0;
    }
    body {
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 30px 20px;
        max-width: 800px;
        margin: 0 auto;
    }
    h1 {
        text-align: center;
        font-size: 24px;
        margin-bottom: 30px;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 15px;
    }
    .tile {
        background: #fff;
        border-radius: 16px;
        padding: 30px 20px;
        text-align: center;
        cursor: pointer;
        box-shadow: 0 1px 3px rgba(24,34,48,0.05);
        font-weight: bold;
        font-size: 16px;
        border: 1px solid var(--line);
        transition: all 0.2s;
    }
    .tile:hover {
        transform: translateY(-2px);
        border-color: var(--blue);
        color: var(--blue);
        box-shadow: 0 4px 12px rgba(49,93,232,0.1);
    }
    .details {
        display: none;
        background: #fff;
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 1px 3px rgba(24,34,48,0.05);
        border: 1px solid var(--line);
    }
    .back-btn {
        background: var(--blue);
        color: #fff;
        border: none;
        padding: 10px 18px;
        border-radius: 10px;
        cursor: pointer;
        margin-bottom: 20px;
        font-weight: 600;
        font-size: 14px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .back-btn:hover {
        opacity: 0.9;
    }
    .event {
        display: grid;
        grid-template-columns: 80px 1fr;
        gap: 15px;
        padding: 15px 0;
        border-bottom: 1px solid var(--line);
    }
    .event:last-child {
        border-bottom: none;
    }
    .date {
        font-size: 12px;
        font-weight: 800;
        color: #344054;
        background: #f1f4fa;
        border-radius: 8px;
        padding: 8px;
        text-align: center;
        height: max-content;
    }
    .event-title {
        font-weight: 700;
        font-size: 15px;
        line-height: 1.4;
    }
    .event-type {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 800;
        margin-top: 6px;
        display: inline-block;
        color: var(--blue);
    }
</style>
</head>
<body>

    <h1 id="main-title">Elementary Academic Calendar</h1>

    <!-- Grid View for Months -->
    <div id="grid-view" class="grid"></div>

    <!-- Detail View for Selected Month -->
    <div id="details-view" class="details">
        <button class="back-btn" onclick="showGrid()">← Back to Months</button>
        <h2 id="month-title" style="margin-top:0; margin-bottom: 20px; font-size: 22px;"></h2>
        <div id="event-list"></div>
    </div>

<script>
const data = [
    ['April 2026',[['01 Apr','Utkal Divas / textbook distribution','event'],['03 Apr','Good Friday','holiday'],['04 Apr','Pranesh Utsav','event'],['05 Apr','Preparation of teaching schemes','academic'],['06 Apr','Formation of school clubs','club'],['07 Apr','Formation of school houses; recapitulation begins','academic'],['08–10 Apr','Recapitulation of previous knowledge continues','academic'],['11 Apr','House activities','club'],['14 Apr','Maha Vishuba Sankranti / Dr. B. R. Ambedkar Jayanti','holiday'],['16 Apr','Development of school information sheet begins','admin'],['18 Apr','Club activities','club'],['20 Apr','Maintenance of student profiles begins','admin']]],
    ['May 2026',[['01 May','Buddha Purnima / Pandit Raghunath Murmu birthday','holiday'],['02–03 May','Health-care book, room cleaning, IT checks and book cataloguing','admin'],['04 May','Staff meeting','admin'],['05 May','Assign holiday homework','academic'],['06–16 May','Summer vacation (verify official dates)','holiday'],['17 May','Campus cleaning and IT/electrical equipment checks','admin'],['20 May','Club activities','club'],['21 May','International Yoga Day (date to verify)','event'],['22 May','Recapitulation of holiday homework','academic']]],
    ['June 2026',[['01–25 Jun','Regular teaching as per syllabus','academic'],['26 Jun','Maharam','holiday'],['27 Jun','House activities','club'],['30 Jun','Staff meeting','admin']]],
    ['July 2026',[['Before 01 Jul','Observation of Hafta-e-Haj begins','event'],['03 Jul','Club activities','club'],['07 Jul','Preparation of craft project','academic'],['10 Jul','Display of craft projects','event'],['11 Jul','House activities','club'],['15 Jul','Ratha Yatra (date to verify)','holiday'],['18 Jul','Club activities / Parent–Teacher Meeting','admin'],['20 Jul','Prepare class-wise magazine','academic'],['23 Jul','Display class-wise magazine','event'],['25 Jul','Bahuda Yatra (date to verify)','holiday'],['26 Jul','House activities','club'],['31 Jul','Staff meeting','admin']]],
    ['August 2026',[['01 Aug','Club activities','club'],['04 Aug','Student health check-up and counselling','event'],['06 Aug','Preparation of project work','academic'],['08 Aug','Project display / house activities','event'],['15 Aug','Independence Day celebration','event'],['24 Aug','Identify and discuss learning hard spots','academic'],['26 Aug','Birthday of Prophet Mohammad (verify notification)','holiday'],['27 Aug','Jhulana Purnima / Raksha Bandhan','holiday'],['28 Aug','World Sanskrit Day','event'],['29 Aug','Club activities / National Sports Day','club']]],
    ['September 2026',[['01 Sep','Need-based student support programme begins','academic'],['September','Observation of Swachhata Paksha begins','event'],['04 Sep','Janmashtami','holiday'],['05 Sep','Club activities / Teachers’ Day','club'],['08 Sep','International Literacy Day','event'],['12 Sep','House activities','club'],['14 Sep','National Hindi Day / Ganesh Puja','event'],['15 Sep','Nuakhai','holiday'],['16 Sep','Day following Nuakhai','holiday'],['18 Sep','Exhibition of club activities','event'],['19 Sep','Club activities','club'],['26 Sep','House activities','club'],['30 Sep','Staff meeting','admin']]],
    ['October 2026',[['01 Oct','Gandhi Jayanti (verify applicable notification)','event'],['02 Oct','Club activities','club'],['10 Oct','Mahalaya','holiday'],['12 Oct','Prepare school bulletin and magazine','academic'],['15 Oct','Parent–Teacher Meeting','admin'],['16 Oct','Assign Puja vacation homework','academic'],['17–26 Oct','Puja vacation / Dussehra holidays','holiday'],['27 Oct','School reopens','academic'],['28 Oct','School-level science exhibition','event'],['31 Oct','Club activities','club']]],
    ['November 2026',[['07 Nov','Club activities','club'],['11 Nov','National Education Day','event'],['12 Nov','SURAVI – State Level Children’s Festival','event'],['20 Nov','Club activities','club'],['24 Nov','Rasa Purnima','holiday'],['26 Nov','Constitution Day','event'],['28 Nov','House activities','club'],['30 Nov','Staff meeting','admin']]],
    ['December 2026',[['01 Dec','Prathamastami','holiday'],['02 Dec','Fit India activities','event'],['03 Dec','International Day of Persons with Disabilities','event'],['05 Dec','Club activities','club'],['12 Dec','House activities','club'],['15 Dec','OVEP activities','event'],['16 Dec','Annual sports','event'],['18 Dec','Annual Day celebration','event'],['21 Dec','Staff meeting','admin'],['22 Dec','National Mathematics Day','event'],['23–31 Dec','Winter vacation','holiday']]],
    ['January 2027',[['01 Jan','School reopens after winter vacation (as listed)','academic'],['16 Jan','Parent–Teacher Meeting','admin'],['26 Jan','Republic Day celebration','event']]],
    ['February 2027',[['27 Feb','Staff meeting','admin'],['28 Feb','National Science Day','event']]],
    ['March 2027',[['30 Mar','Staff meeting','admin'],['31 Mar','SA2 result declaration / programme week','academic']]]
];

const names = {
    academic: 'Academic activity',
    holiday: 'Holiday / vacation',
    club: 'Club / house activity',
    event: 'Event / celebration',
    admin: 'Administrative'
};

const gridView = document.getElementById('grid-view');
const detailsView = document.getElementById('details-view');
const titleEl = document.getElementById('month-title');
const listEl = document.getElementById('event-list');
const mainTitle = document.getElementById('main-title');

// Render the initial grid of months
data.forEach((monthData, index) => {
    let tile = document.createElement('div');
    tile.className = 'tile';
    tile.textContent = monthData[0];
    tile.onclick = () => showDetails(index);
    gridView.appendChild(tile);
});

// Show the specific events when a month is clicked
function showDetails(index) {
    const monthData = data[index];
    titleEl.textContent = monthData[0];
    
    listEl.innerHTML = monthData[1].map(event => `
        <div class="event">
            <div class="date">${event[0]}</div>
            <div>
                <div class="event-title">${event[1]}</div>
                <span class="event-type">${names[event[2]] || event[2]}</span>
            </div>
        </div>
    `).join('');
    
    gridView.style.display = 'none';
    mainTitle.style.display = 'none';
    detailsView.style.display = 'block';
}

// Return to the grid view
function showGrid() {
    detailsView.style.display = 'none';
    gridView.style.display = 'grid';
    mainTitle.style.display = 'block';
}
</script>
</body>
</html>
