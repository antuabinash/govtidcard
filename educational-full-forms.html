    <style>
        :root {
            --primary-orange: #f06511;
            --primary-blue: #2563EB;
            --light-blue: #DBEAFE;
            --bg-color: #F8FAFC;
            --white: #FFFFFF;
            --text-dark: #1E293B;
            --text-gray: #64748B;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
        }

        /* Header & Search */
        header {
            background-color: var(--primary-orange);
            padding: 2.5rem 1rem;
            text-align: center;
            color: var(--white);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-md);
        }

        header h1 {
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
            font-weight: 600;
        }

        .search-container {
            max-width: 600px;
            margin: 1.5rem auto 0;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3.2rem;
            border: none;
            border-radius: 50px;
            font-size: 1.05rem;
            box-shadow: var(--shadow-md);
            outline: none;
            transition: box-shadow 0.3s ease;
        }

        .search-input:focus {
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.4);
        }

        .search-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
        }

        /* Main Content */
        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .stats {
            margin-bottom: 1.5rem;
            color: var(--text-gray);
            font-weight: 600;
            text-align: center;
            font-size: 0.95rem;
        }

        /* Grid / List Layout */
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.2rem;
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            border-left: 5px solid var(--primary-blue);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .abbr-badge {
            background-color: var(--white);
            color: var(--primary-blue);
            border: 2px solid var(--light-blue);
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .category-badge {
            background-color: var(--light-blue);
            color: var(--primary-blue);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .full-form {
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--text-dark);
            margin-top: 0.5rem;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--text-gray);
            font-size: 1.2rem;
            background: var(--white);
            border-radius: 10px;
            display: none;
        }

    </style>

            grid.innerHTML = ''; // Clear current grid
            
            if (data.length === 0) {
                noResults.style.display = 'block';
                resultCount.textContent = '0 results found';
                return;
            } else {
                noResults.style.display = 'none';
                resultCount.textContent = `Showing ${data.length} abbreviation${data.length !== 1 ? 's' : ''}`;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <div class="card-header">
                        <span class="abbr-badge">${item.Abbreviation || 'N/A'}</span>
                        <span class="category-badge">${item.Category || 'General'}</span>
                    </div>
                    <div class="full-form">${item['Full Form (English)'] || 'N/A'}</div>
                `;
                
                grid.appendChild(card);
            });
        }

        // Initial render of all data
        renderCards(abbrData);

        // Search Filter Logic
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();
            
            const filteredData = abbrData.filter(item => {
                const abbr = (item.Abbreviation || '').toLowerCase();
                const fullForm = (item['Full Form (English)'] || '').toLowerCase();
                const category = (item.Category || '').toLowerCase();
                
                // Check if the search term exists in any of the fields
                return abbr.includes(searchTerm) || 
                       fullForm.includes(searchTerm) || 
                       category.includes(searchTerm);
            });
            
            renderCards(filteredData);
        });
    </script>
</body>
</html>
