<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ଅନ୍ୟାନ୍ୟ | More Apps</title>
<link rel="stylesheet" href="kids_app.css">
</head>
<body class="lang-or">

<div class="bg-decorations">
  <div class="sun-decor"></div>
  <div class="cloud c1"></div>
</div>

<div id="kidsHeader"></div>

<div class="app-container">
  <main class="kids-grid" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-top: 30px;">
    <a href="https://play.google.com/store/apps/details?id=com.pabitra.allbooks" class="kids-card c-ocean" target="_blank" rel="noopener noreferrer">
      <div class="card-icon"><img src="table.webp" alt="Books"></div>
      <span class="card-label" data-or="ଓଡ଼ିଶା ବହି" data-en="Odisha Books">ଓଡ଼ିଶା ବହି</span>
    </a>

    <a href="https://play.google.com/store/apps/details?id=com.pabitra.eduodiaquiz" class="kids-card c-orange" target="_blank" rel="noopener noreferrer">
      <div class="card-icon"><img src="puzzle_icon.webp" alt="Quiz"></div>
      <span class="card-label" data-or="ଓଡ଼ିଶା MCQ" data-en="Odisha MCQs">ଓଡ଼ିଶା MCQ</span>
    </a>

    <a href="https://play.google.com/store/apps/details?id=com.odia.kidsapp" class="kids-card c-grass" target="_blank" rel="noopener noreferrer">
      <div class="card-icon"><img src="bhasa_icon.webp" alt="Odia learning app"></div>
      <span class="card-label" data-or="ଓଡ଼ିଆ କିଡ୍ସ ଆପ୍" data-en="Odia KidsApp">ଓଡ଼ିଆ କିଡ୍ସ ଆପ୍</span>
    </a>
  </main>
</div>

<script src="kids_app.js"></script>
<script>
  KidsApp.injectHeader('ଅନ୍ୟାନ୍ୟ', 'More Apps', '');
</script>
</body>
</html>
