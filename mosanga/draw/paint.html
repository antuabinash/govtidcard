<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ପେଣ୍ଟିଂ ଷ୍ଟୁଡିଓ | Paint Studio</title>
<link rel="stylesheet" href="../kids_app.css">
<style>
  .paint-studio-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
  }
  .studio-canvas-container {
    position: relative;
    width: min(420px, 92vw);
    height: min(420px, 60vh);
    background: #FFFFFF;
    border: 5px solid var(--orange);
    border-radius: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    overflow: hidden;
  }
  #paintCanvas {
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }
  .studio-toolbar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    max-width: 95vw;
  }
  .color-dot {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid #FFF;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .color-dot.active {
    transform: scale(1.25);
    border-color: var(--ink);
  }
  .stamp-btn {
    font-size: 24px;
    padding: 6px 12px;
    background: #FFF;
    border: 2px solid var(--orange);
    border-radius: 999px;
    cursor: pointer;
  }
  .stamp-btn.active {
    background: var(--orange);
  }
</style>
</head>
<body class="lang-or">

<div class="bg-decorations">
  <div class="sun-decor"></div>
  <div class="cloud c1"></div>
</div>

<div id="kidsHeader"></div>

<div class="app-container">
  <div class="paint-studio-wrap">
    <!-- Canvas Studio -->
    <div class="studio-canvas-container">
      <canvas id="paintCanvas"></canvas>
    </div>

    <!-- Toolbar Palette -->
    <div class="studio-toolbar">
      <div class="color-dot active" style="background: #FF6B6B;" onclick="setColor('#FF6B6B', this)"></div>
      <div class="color-dot" style="background: #FF9F43;" onclick="setColor('#FF9F43', this)"></div>
      <div class="color-dot" style="background: #FFC93C;" onclick="setColor('#FFC93C', this)"></div>
      <div class="color-dot" style="background: #3DDC97;" onclick="setColor('#3DDC97', this)"></div>
      <div class="color-dot" style="background: #2EA8FF;" onclick="setColor('#2EA8FF', this)"></div>
      <div class="color-dot" style="background: #8E6BFF;" onclick="setColor('#8E6BFF', this)"></div>
      <div class="color-dot" style="background: #FF8AC6;" onclick="setColor('#FF8AC6', this)"></div>

      <!-- Stamps -->
      <button type="button" class="stamp-btn" id="stampStar" onclick="setStamp('⭐', this)">⭐</button>
      <button type="button" class="stamp-btn" id="stampHeart" onclick="setStamp('❤️', this)">❤️</button>
      <button type="button" class="stamp-btn" id="stampBalloon" onclick="setStamp('🎈', this)">🎈</button>

      <!-- Actions -->
      <button type="button" class="nav-btn" style="background: var(--coral); color: #FFF;" onclick="clearCanvas()">
        🗑️ <span data-or="ସଫା" data-en="Clear">ସଫା</span>
      </button>
      <button type="button" class="nav-btn" style="background: var(--grass); color: var(--ink);" onclick="downloadDrawing()">
        💾 <span data-or="ସେଭ୍" data-en="Save">ସେଭ୍</span>
      </button>
    </div>
  </div>
</div>

<script src="../kids_app.js"></script>
<script>
  KidsApp.injectHeader('ପେଣ୍ଟିଂ ଷ୍ଟୁଡିଓ', 'Paint Studio', '../');

  var canvas = document.getElementById('paintCanvas');
  var ctx = canvas.getContext('2d');
  var isDrawing = false;
  var currentColor = '#FF6B6B';
  var currentStamp = null;

  function resizeCanvas() {
    var rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resizeCanvas);
  setTimeout(resizeCanvas, 100);

  function getPos(e) {
    var rect = canvas.getBoundingClientRect();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  function startDraw(e) {
    var pos = getPos(e);
    if (currentStamp) {
      ctx.font = '40px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(currentStamp, pos.x, pos.y);
      KidsApp.playSound('pop');
      return;
    }

    isDrawing = true;
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = 10;
    KidsApp.playSound('click');
  }

  function moveDraw(e) {
    if (!isDrawing || currentStamp) return;
    var pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function stopDraw() {
    if (isDrawing) {
      isDrawing = false;
      ctx.closePath();
    }
  }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', moveDraw);
  canvas.addEventListener('mouseup', stopDraw);
  canvas.addEventListener('mouseleave', stopDraw);

  canvas.addEventListener('touchstart', function(e) { e.preventDefault(); startDraw(e); }, { passive: false });
  canvas.addEventListener('touchmove', function(e) { e.preventDefault(); moveDraw(e); }, { passive: false });
  canvas.addEventListener('touchend', stopDraw);

  function setColor(color, el) {
    KidsApp.playSound('click');
    currentColor = color;
    currentStamp = null;
    document.querySelectorAll('.color-dot').forEach(function(d) { d.classList.remove('active'); });
    document.querySelectorAll('.stamp-btn').forEach(function(s) { s.classList.remove('active'); });
    el.classList.add('active');
  }

  function setStamp(stampSymbol, el) {
    KidsApp.playSound('click');
    currentStamp = stampSymbol;
    document.querySelectorAll('.color-dot').forEach(function(d) { d.classList.remove('active'); });
    document.querySelectorAll('.stamp-btn').forEach(function(s) { s.classList.remove('active'); });
    el.classList.add('active');
  }

  function clearCanvas() {
    KidsApp.playSound('click');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function downloadDrawing() {
    KidsApp.playSound('cheer');
    KidsApp.triggerConfetti();
    var link = document.createElement('a');
    link.download = 'my-drawing.png';
    link.href = canvas.toDataURL();
    link.click();
  }
</script>
</body>
</html>
