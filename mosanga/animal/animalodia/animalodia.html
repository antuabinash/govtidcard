<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ପଶୁ ଶିକ୍ଷା | Animal Learning</title>
<link rel="stylesheet" href="../../kids_app.css">
<style>
  .flashcard-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-top: 20px;
    position: relative;
  }
  .flashcard-box {
    width: min(340px, 85vw);
    height: min(340px, 85vw);
    background: #FFFFFF;
    border: 5px solid var(--orange);
    border-radius: 32px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
  }
  .flashcard-box img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .animal-name {
    margin-top: 15px;
    font-size: 32px;
    font-weight: 800;
    color: var(--ink);
    text-align: center;
  }
  .slideshow-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
  }
  .arrow-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #FFFFFF;
    border: 3px solid var(--orange);
    font-size: 28px;
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--orange);
  }
  .arrow-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 var(--orange);
  }
</style>
</head>
<body class="lang-or">

<div class="bg-decorations">
  <div class="sun-decor"></div>
  <div class="cloud c1"></div>
</div>

<div id="kidsHeader"></div>

<div class="app-container">
  <div class="flashcard-stage">
    <div class="flashcard-box">
      <img id="animalImg" src="animal_cat.webp" alt="Animal">
    </div>

    <div class="animal-name" id="animalName" data-or="ବିଲେଇ" data-en="Cat">ବିଲେଇ</div>

    <div class="slideshow-nav">
      <button type="button" class="arrow-btn" onclick="prevAnimal()">⬅️</button>
      <button type="button" class="nav-btn" style="background: var(--orange); color: #FFF; font-size: 18px;" onclick="playAudio()">
        🔊 <span data-or="ଶୁଣନ୍ତୁ" data-en="Listen">ଶୁଣନ୍ତୁ</span>
      </button>
      <button type="button" class="arrow-btn" onclick="nextAnimal()">➡️</button>
    </div>
  </div>
</div>

<script src="../../kids_app.js"></script>
<script>
  KidsApp.injectHeader('ପଶୁ ଶିକ୍ଷା', 'Animal Learning', '../../');

  var animals = [
    { nameOr: 'ବିଲେଇ', nameEn: 'Cat', img: 'animal_cat.webp', audio: 'cat.mp3' },
    { nameOr: 'କୁକୁର', nameEn: 'Dog', img: 'animal_dog.webp', audio: 'dog.mp3' },
    { nameOr: 'ବିଲୁଆ', nameEn: 'Fox', img: 'animal_fox.webp', audio: 'fox.mp3' },
    { nameOr: 'ଜିରାଫ୍', nameEn: 'Giraffe', img: 'animal_giraffe.webp', audio: 'girrafe.mp3' },
    { nameOr: 'ଛେଳି', nameEn: 'Goat', img: 'animal_goat.webp', audio: 'goat.mp3' },
    { nameOr: 'ଜଳହସ୍ତୀ', nameEn: 'Hippopotamus', img: 'animal_hippopotamus.webp', audio: 'hippopotamus.mp3' },
    { nameOr: 'କଙ୍ଗାରୁ', nameEn: 'Kangaroo', img: 'animal_kangaroo.webp', audio: 'kangaroo.mp3' },
    { nameOr: 'ଜେବ୍ରା', nameEn: 'Zebra', img: 'animal_zebra.webp', audio: 'zebra.mp3' }
  ];

  var currentIndex = 0;

  function updateCard() {
    var item = animals[currentIndex];
    document.getElementById('animalImg').src = item.img;
    var el = document.getElementById('animalName');
    el.setAttribute('data-or', item.nameOr);
    el.setAttribute('data-en', item.nameEn);

    var lang = 'or';
    try { lang = localStorage.getItem('mosanga-lang') || 'or'; } catch (e) {}
    el.textContent = lang === 'or' ? item.nameOr : item.nameEn;
  }

  function prevAnimal() {
    KidsApp.playSound('click');
    currentIndex = (currentIndex - 1 + animals.length) % animals.length;
    updateCard();
    playAudio();
  }

  function nextAnimal() {
    KidsApp.playSound('click');
    currentIndex = (currentIndex + 1) % animals.length;
    updateCard();
    playAudio();
  }

  function playAudio() {
    var item = animals[currentIndex];
    KidsApp.speakOrPlay(item, item.audio);
  }

  updateCard();
</script>
</body>
</html>
