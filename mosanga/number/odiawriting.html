<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ସଂଖ୍ୟା ଲିଖନ | Number Tracing</title>
<link rel="stylesheet" href="../kids_app.css">
<style>
  .tracing-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-top: 10px;
  }
  .canvas-stage {
    position: relative;
    width: min(340px, 85vw);
    height: min(340px, 85vw);
    background: #FFFFFF;
    border: 5px solid var(--grass);
    border-radius: 28px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    overflow: hidden;
  }
  #tracingGuide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(140px, 35vw, 200px);
    font-weight: 800;
    color: rgba(43, 45, 91, 0.12);
    pointer-events: none;
    user-select: none;
  }
  #paintCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }
  .tools-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .color-dot {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 3px solid #FFF;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .color-dot.active {
    transform: scale(1.25);
    border-color: var(--ink);
  }
  .num-selector {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    max-width: 90vw;
    padding: 6px 4px;
  }
  .num-chip {
    padding: 6px 14px;
    background: #FFFFFF;
    border: 2px solid var(--grass);
    border-radius: 999px;
    font-weight: 800;
    font-size: 20px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 3px 0 var(--grass);
  }
  .num-chip.active {
    background: var(--grass);
    color: var(--ink);
  }
</style>
</head>
<body class="lang-or">

<div class="bg-decorations">
  <div class="sun-decor"></div>
  <div class="cloud c1"></div>
</div>

<div id="kidsHeader"></div>

<div class="app-container">
  <div class="tracing-wrap">
    <!-- Number selector -->
    <div class="num-selector" id="numSelector"></div>

    <!-- Canvas Stage -->
    <div class="canvas-stage">
      <div id="tracingGuide">୧</div>
      <canvas id="paintCanvas"></canvas>
    </div>

    <!-- Color Palette & Tools -->
    <div class="tools-row">
      <div class="color-dot active" style="background: #3DDC97;" onclick="setColor('#3DDC97', this)"></div>
      <div class="color-dot" style="background: #FF6B6B;" onclick="setColor('#FF6B6B', this)"></div>
      <div class="color-dot" style="background: #2EA8FF;" onclick="setColor('#2EA8FF', this)"></div>
      <div class="color-dot" style="background: #8E6BFF;" onclick="setColor('#8E6BFF', this)"></div>
      <div class="color-dot" style="background: #FFC93C;" onclick="setColor('#FFC93C', this)"></div>

      <button type="button" class="nav-btn" style="background: var(--coral); color: #FFF;" onclick="clearCanvas()">
        🗑️ <span data-or="ସଫା କରନ୍ତୁ" data-en="Clear">ସଫା କରନ୍ତୁ</span>
      </button>
      <button type="button" class="nav-btn" style="background: var(--sun); color: var(--ink);" onclick="finishDrawing()">
        ⭐ <span data-or="ସମ୍ପୂର୍ଣ୍ଣ" data-en="Done">ସମ୍ପୂର୍ଣ୍ଣ</span>
      </button>
    </div>
  </div>
</div>

<script src="../kids_app.js"></script>
<script>
  KidsApp.injectHeader('ସଂଖ୍ୟା ଲିଖନ', 'Number Tracing', '../');

  var odiaNumList = ['୧', '୨', '୩', '୪', '୫', '୬', '୭', '୮', '୯', '୧୦'];
  var englishNumList = Array.from({ length: 20 }, function(_, index) { return String(index + 1); });
  var currentLanguage = document.documentElement.lang;
  var currentNum = currentLanguage === 'en' ? '1' : '୧';
  var currentColor = '#3DDC97';

  var selector = document.getElementById('numSelector');
  function renderNumberSelector(lang) {
    selector.innerHTML = '';
    var numList = lang === 'en' ? englishNumList : odiaNumList;
    currentNum = numList[0];
    document.getElementById('tracingGuide').textContent = currentNum;

    numList.forEach(function(n, i) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'num-chip' + (i === 0 ? ' active' : '');
      chip.textContent = n;
      chip.onclick = function() {
        document.querySelectorAll('.num-chip').forEach(function(c) { c.classList.remove('active'); });
        chip.classList.add('active');
        setNum(n);
      };
      selector.appendChild(chip);
    });
  }

  renderNumberSelector(currentLanguage);
  document.addEventListener('kidsapp:languagechange', function(event) {
    currentLanguage = event.detail.lang;
    renderNumberSelector(currentLanguage);
  });

  function setNum(n) {
    KidsApp.playSound('click');
    currentNum = n;
    document.getElementById('tracingGuide').textContent = n;
    clearCanvas();
    if (currentLanguage === 'en') {
      KidsApp.speakText('Number ' + n, 'en-IN');
    } else {
      var num = parseInt(n, 10);
      if (isNaN(num)) num = ['୧', '୨', '୩', '୪', '୫', '୬', '୭', '୮', '୯', '୧୦'].indexOf(n) + 1;
      var audio = new Audio('odianumber/number' + num + '.mp3');
      audio.play().catch(function() {});
    }
  }

  // Canvas Setup
  var canvas = document.getElementById('paintCanvas');
  var ctx = canvas.getContext('2d');
  var isDrawing = false;

  function resizeCanvas() {
    var rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
  }
  window.addEventListener('resize', resizeCanvas);
  setTimeout(resizeCanvas, 100);

  function getPos(e) {
    var rect = canvas.getBoundingClientRect();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  function startDraw(e) {
    isDrawing = true;
    var pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = 14;
    KidsApp.playSound('click');
  }

  function moveDraw(e) {
    if (!isDrawing) return;
    var pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function stopDraw() {
    if (isDrawing) {
      isDrawing = false;
      ctx.closePath();
    }
  }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', moveDraw);
  canvas.addEventListener('mouseup', stopDraw);
  canvas.addEventListener('mouseleave', stopDraw);

  canvas.addEventListener('touchstart', function(e) { e.preventDefault(); startDraw(e); }, { passive: false });
  canvas.addEventListener('touchmove', function(e) { e.preventDefault(); moveDraw(e); }, { passive: false });
  canvas.addEventListener('touchend', stopDraw);

  function setColor(color, el) {
    KidsApp.playSound('click');
    currentColor = color;
    document.querySelectorAll('.color-dot').forEach(function(d) { d.classList.remove('active'); });
    el.classList.add('active');
  }

  function clearCanvas() {
    KidsApp.playSound('click');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function finishDrawing() {
    KidsApp.playSound('cheer');
    KidsApp.triggerConfetti();
  }
</script>
</body>
</html>
