<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shape Slideshow</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; /* Prevent scrolling */
        }

        /* --- Header --- */
        header {
            width: 100%;
            padding: 10px 0;
            background-color: #fa86e1; /* Matches Shape Theme */
            color: white;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex-shrink: 0;
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* --- Main Content Area --- */
        .content-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
        }

        #slideshow {
            width: 90%;
            max-width: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #slideshow img {
            max-width: 100%;
            max-height: 60vh; /* Keeps image from being too tall in landscape */
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
            transition: transform 0.2s ease;
        }

        #shapeName {
            margin-top: 20px;
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }

        /* --- Animation Video --- */
        #webm-container {
            position: fixed;
            top: 5px;
            right: 5px;
            width: 50px;
            height: 50px;
            z-index: 20;
            pointer-events: none;
        }

        /* --- Navigation Arrows --- */
        .navArrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            z-index: 100;
            width: 60px;
            height: 60px;
            opacity: 0.7;
            transition: opacity 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .navArrow:active {
            transform: translateY(-50%) scale(0.9);
        }

        .navArrow:hover {
            opacity: 1;
        }

        #prevArrow {
            left: 20px;
        }

        #nextArrow {
            right: 20px;
        }

        /* --- Landscape Specifics --- */
        @media (orientation: landscape) {
            #slideshow img {
                max-height: 70vh; /* Use more height in landscape */
            }
            #shapeName {
                margin-top: 10px;
                font-size: 28px;
            }
            .navArrow {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1 data-or="ଆକୃତି" data-en="Shapes">ଆକୃତି</h1>
        <video id="webm-container" autoplay loop muted playsinline>
          <source src="shapeanimation.webm" type="video/webm">
        </video>
                <button type="button" id="langSwitchBtn" class="language-toggle-btn" onclick="KidsApp.switchLang()" style="position: absolute; top: 8px; right: 8px; z-index: 30; padding: 6px 10px; border: 2px solid #fff; border-radius: 20px; background: #3DDC97; font-weight: 700; cursor: pointer;">English ✓</button>
    </header>

    <div class="content-wrapper">
        <img id="prevArrow" class="navArrow" src="left-arrow.png" onclick="showPrevShape()" alt="Previous">
        <img id="nextArrow" class="navArrow" src="right-arrow.png" onclick="showNextShape()" alt="Next">

        <div id="slideshow">
            </div>
        
        <div id="shapeName"></div>
    </div>

    <audio id="triangleAudio" src="ତ୍ରିଭୁଜ.mp3"></audio>
    <audio id="rectangleAudio" src="ଆୟତଚିତ୍ର.mp3"></audio>
    <audio id="squareAudio" src="ବର୍ଗଚିତ୍ର.mp3"></audio>
    <audio id="circleAudio" src="ବୃତ୍ତ.mp3"></audio>
    <audio id="coneAudio" src="କୋନ.mp3"></audio>
    <audio id="hexagonAudio" src="ଷଡଭୁଜ.mp3"></audio>
    <audio id="octagonAudio" src="ଅଷ୍ଟଭୁଜ.mp3"></audio>
    <audio id="ovalAudio" src="ଅଣ୍ଡାକାର.mp3"></audio>
    <audio id="pentagonAudio" src="ପଞ୍ଚଭୁଜ.mp3"></audio>
    <audio id="rhombusAudio" src="ରମ୍ବସ.mp3"></audio>
    <audio id="starAudio" src="ତାରା.mp3"></audio>
    <audio id="cubeAudio" src="ସମଘନ.mp3"></audio>
    <audio id="cylinderAudio" src="ସିଲିଣ୍ଡର.mp3"></audio>
    <audio id="prismAudio" src="ପ୍ରିଜମ.mp3"></audio>

    <script src="../../kids_app.js"></script>
    <script>
        const shapes = [
            { name: "ତ୍ରିଭୁଜ", nameEn: "Triangle", image: "triangle.png", audioId: "triangleAudio" },
            { name: "ଆୟତଚିତ୍ର", nameEn: "Rectangle", image: "rectangle.png", audioId: "rectangleAudio" },
            { name: "ବର୍ଗଚିତ୍ର", nameEn: "Square", image: "square.png", audioId: "squareAudio" },
            { name: "ବୃତ୍ତ", nameEn: "Circle", image: "circle.png", audioId: "circleAudio" },
            { name: "କୋନ", nameEn: "Cone", image: "cone.png", audioId: "coneAudio" },
            { name: "ଷଡ଼ଭୁଜ", nameEn: "Hexagon", image: "hexagon.png", audioId: "hexagonAudio" },
            { name: "ଅଷ୍ଟଭୁଜ", nameEn: "Octagon", image: "octagon.png", audioId: "octagonAudio" },
            { name: "ଅଣ୍ଡାକାର", nameEn: "Oval", image: "oval.png", audioId: "ovalAudio" },
            { name: "ପଞ୍ଚଭୁଜ", nameEn: "Pentagon", image: "pentagon.png", audioId: "pentagonAudio" },
            { name: "ରମ୍ବସ", nameEn: "Rhombus", image: "rhombus.png", audioId: "rhombusAudio" },
            { name: "ତାରା", nameEn: "Star", image: "star.png", audioId: "starAudio" },
            { name: "ସମଘନ", nameEn: "Cube", image: "cube.png", audioId: "cubeAudio" },
            { name: "ସିଲିଣ୍ଡର", nameEn: "Cylinder", image: "cylinder.png", audioId: "cylinderAudio" },
            { name: "ପ୍ରିଜମ୍", nameEn: "Prism", image: "prism.png", audioId: "prismAudio" }
        ];

        let currentIndex = 0;
        const slideshow = document.getElementById('slideshow');
        const shapeNameElement = document.getElementById('shapeName');

        function isEnglishSelected() {
            try { return localStorage.getItem('mosanga-lang') === 'en'; } catch (e) { return false; }
        }

        function playCurrentShape(shape) {
            if (isEnglishSelected()) {
                KidsApp.speakText(shape.nameEn, 'en-IN');
            } else {
                const audio = document.getElementById(shape.audioId);
                if (audio) audio.play().catch(e => console.log("Autoplay blocked"));
            }
        }

        function showShape(index) {
            // Loop functionality
            if (index < 0) {
                index = shapes.length - 1;
            } else if (index >= shapes.length) {
                index = 0;
            }

            const shape = shapes[index];
            slideshow.innerHTML = `<img src="${shape.image}" alt="${shape.nameEn}">`;
            shapeNameElement.textContent = isEnglishSelected() ? shape.nameEn : shape.name;
            currentIndex = index;

            // Stop other audios and play current
            document.querySelectorAll('audio').forEach(a => { a.pause(); a.currentTime = 0; });
            playCurrentShape(shape);
        }

        KidsApp.applyLang(localStorage.getItem('mosanga-lang') || 'or');
        document.addEventListener('kidsapp:languagechange', () => showShape(currentIndex));
        window.onload = () => showShape(currentIndex);

        // Swipe logic
        let touchStartX = 0;
        document.body.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
        });
        document.body.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].clientX;
            handleSwipe(touchEndX);
        });

        function handleSwipe(touchEndX) {
            const swipeThreshold = 50;
            if (touchEndX < touchStartX - swipeThreshold) {
                showShape(currentIndex + 1);
            } else if (touchEndX > touchStartX + swipeThreshold) {
                showShape(currentIndex - 1);
            }
        }

        function showPrevShape() {
            showShape(currentIndex - 1);
        }

        function showNextShape() {
            showShape(currentIndex + 1);
        }

        // Play audio on click (ignoring nav buttons)
        document.body.addEventListener('click', (event) => {
            if (!event.target.closest('.navArrow, .language-toggle-btn')) {
                playCurrentShape(shapes[currentIndex]);
            }
        });
    </script>
</body>
</html>
