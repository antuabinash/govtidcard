<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ଋତୁ | Seasons</title>
<link rel="stylesheet" href="../kids_app.css">
<style>
  .seasons-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .season-card {
    position: relative;
    background: #FFFFFF;
    border: 4px solid var(--grape);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 6px 0 var(--grape);
    cursor: pointer;
    transition: transform 0.15s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .season-card:hover {
    transform: translateY(-4px);
  }
  .season-card:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--grape);
  }
  .season-card img {
    width: 100%;
    height: 130px;
    object-fit: cover;
  }
  .season-label {
    padding: 10px 4px;
    width: 100%;
    background: #FFFFFF;
    text-align: center;
  }
  .season-odia {
    font-size: 22px;
    font-weight: 800;
    color: var(--ink);
    display: block;
  }
  .season-eng {
    font-size: 14px;
    font-weight: 700;
    color: var(--coral);
    display: block;
  }
  body.lang-or .season-eng,
  body.lang-en .season-odia {
    display: none;
  }
</style>
</head>
<body class="lang-or">

<div class="bg-decorations">
  <div class="sun-decor"></div>
  <div class="cloud c1"></div>
</div>

<div id="kidsHeader"></div>

<div class="app-container">
  <div class="seasons-grid" id="seasonsGrid"></div>
</div>

<script src="../kids_app.js"></script>
<script>
  KidsApp.injectHeader('ଋତୁ', 'Seasons', '../');

  var seasons = [
    { odia: 'ଗ୍ରୀଷ୍ମ', eng: 'Summer (☀️)', nameEn: 'Summer', img: 'summer.gif', audio: 'summer.mp3' },
    { odia: 'ବର୍ଷା', eng: 'Monsoon / Rainy (🌧️)', nameEn: 'Monsoon', img: 'rain.gif', audio: 'rain.mp3' },
    { odia: 'ଶରତ', eng: 'Autumn (🍂)', nameEn: 'Autumn', img: 'autumn.gif', audio: 'autumn.mp3' },
    { odia: 'ହେମନ୍ତ', eng: 'Late Autumn (🌾)', nameEn: 'Late autumn', img: 'dew.gif', audio: 'dew.mp3' },
    { odia: 'ଶୀତ', eng: 'Winter (❄️)', nameEn: 'Winter', img: 'winter.gif', audio: 'winter.mp3' },
    { odia: 'ବସନ୍ତ', eng: 'Spring (🌸)', nameEn: 'Spring', img: 'spring.gif', audio: 'spring.mp3' }
  ];

  var container = document.getElementById('seasonsGrid');
  seasons.forEach(function(s) {
    var card = document.createElement('div');
    card.className = 'season-card';

    var img = document.createElement('img');
    img.src = s.img;
    img.alt = '';

    var lbl = document.createElement('div');
    lbl.className = 'season-label';

    var od = document.createElement('span');
    od.className = 'season-odia';
    od.textContent = s.odia;

    var en = document.createElement('span');
    en.className = 'season-eng';
    en.textContent = s.eng;

    lbl.appendChild(od);
    lbl.appendChild(en);
    card.appendChild(img);
    card.appendChild(lbl);

    card.onclick = function() {
      KidsApp.playSound('click');
      if (document.documentElement.lang === 'en') {
        KidsApp.speakText(s.nameEn, 'en-IN');
      } else {
        var audio = new Audio(s.audio);
        audio.play().catch(function() { KidsApp.playSound('pop'); });
      }
    };

    container.appendChild(card);
  });
</script>
</body>
</html>
