<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Study Zone</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Oriya:wght@400;600;700&display=swap');

        :root {
            --app-bg: #F4F6F9;
            --card-bg: #FFFFFF;
            --text-main: #1D1D1F;
            --text-muted: #86868B;
            --primary: #007AFF;
            --radius-xl: 24px;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.04);
            
            /* Notebook Variables */
            --paper-color: #ffffff;
            --line-color: #e2e8f0;
            --margin-color: #ff8787;
            --heading-color: #1a202c;
            --line-height: 40px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Oriya', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--app-bg); color: var(--text-main); line-height: 1.5; padding-bottom: 80px; }
        
        /* Header & Navigation */
        .app-header { 
            padding: 20px 24px; 
            background: rgba(244, 246, 249, 0.85); 
            backdrop-filter: blur(12px); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            display: flex; 
            align-items: center; 
            border-bottom: 1px solid rgba(0,0,0,0.03); 
            gap: 15px;
        }
        .back-btn {
            background: #e2e8f0;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: none; 
            padding: 8px 16px;
            border-radius: 20px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: #cbd5e1; }
        .app-title { font-size: 22px; font-weight: 800; color: var(--text-main); flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Main Grid */
        .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
        .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        
        /* Cards */
        .app-card { 
            background: var(--card-bg); 
            border-radius: var(--radius-xl); 
            padding: 24px 16px; 
            box-shadow: var(--shadow-soft); 
            cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s; 
            text-align: center;
        }
        .app-card:active { transform: scale(0.96); }
        .icon-box { 
            width: 60px; height: 60px; border-radius: 18px; display: flex; align-items: center; justify-content: center; 
            font-size: 30px; margin: 0 auto 16px auto; 
        }
        .app-card h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; color: var(--text-main); }
        .app-card p { font-size: 13px; color: var(--text-muted); }

        /* Specific Icon Colors */
        .bg-class { background: linear-gradient(135deg, #A18CD1 0%, #FBC2EB 100%); }
        .bg-subject { background: linear-gradient(135deg, #84FAB0 0%, #8FD3F4 100%); }
        .bg-chapter { background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 100%); }
        .bg-saransa { background: linear-gradient(135deg, #4FACFE 0%, #00F2FE 100%); }
        .bg-mukhya { background: linear-gradient(135deg, #FF9A44 0%, #FC6076 100%); }
        .bg-prasna { background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%); }

        #loader { text-align: center; padding: 40px; color: var(--text-muted); font-size: 16px; }

        /* =========================================
           NOTEBOOK VIEW STYLES
           ========================================= */
        .notebook-wrapper {
            display: none; 
            justify-content: center;
            animation: fadeIn 0.3s ease-in-out;
        }
        .notebook-wrapper.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .print-btn {
            position: fixed;
            top: 80px;
            right: 40px;
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
            display: none; 
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .print-btn:hover { background-color: #45a049; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(76, 175, 80, 0.4); }

        .notebook-page {
            background-color: var(--paper-color);
            width: 100%;
            max-width: 850px;
            min-height: 1100px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
            background-image: repeating-linear-gradient(
                var(--paper-color) 0px,
                var(--paper-color) calc(var(--line-height) - 1px),
                var(--line-color) calc(var(--line-height) - 1px),
                var(--line-color) var(--line-height)
            );
            background-position: 0 120px;
            display: flex;
            flex-direction: column;
        }

        .notebook-page::before { content: ''; position: absolute; top: 0; bottom: 0; left: 80px; width: 2px; background-color: var(--margin-color); z-index: 1; }
        .notebook-page::after { content: ''; position: absolute; top: 0; bottom: 0; left: 85px; width: 1px; background-color: var(--margin-color); opacity: 0.5; z-index: 1; }

        .page-header {
            padding: 40px 20px 30px 100px;
            background-color: var(--paper-color);
            border-bottom: 2px solid var(--line-color);
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            text-align: center;
        }

        .chapter-title { font-size: 28px; font-weight: 700; color: var(--heading-color); line-height: 1.2; }

        .page-content {
            padding: 0 40px 0px 110px;
            position: relative;
            z-index: 2;
            margin-top: calc(var(--line-height) - 26px);
            flex-grow: 1;
        }

        .page-content p { font-size: 18px; line-height: var(--line-height); margin-bottom: var(--line-height); text-align: justify; color: #1e293b; }
        .page-content p::first-letter { margin-left: 30px; }
        
        .page-content ul { padding-left: 30px; margin-bottom: var(--line-height); }
        .page-content li { font-size: 18px; line-height: var(--line-height); color: #1e293b; margin-bottom: 0; list-style-type: disc;}
        
        .notebook-qna { margin-bottom: var(--line-height); }
        .notebook-q { font-weight: 700; color: #d90429; font-size: 18px; line-height: var(--line-height); }
        .notebook-a { font-weight: 400; color: #1e293b; font-size: 18px; line-height: var(--line-height); padding-left: 20px; text-align: justify;}

        .page-footer {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px 20px 20px 100px;
            font-size: 13px;
            color: #a0aec0;
            font-family: sans-serif;
        }

        /* Print Media Query */
        @media print {
            body { background-color: white; padding: 0; }
            .no-print { display: none !important; }
            .app-header { display: none !important; }
            .container { padding: 0; max-width: 100%; }
            .notebook-page { box-shadow: none; border: none; max-width: 100%; min-height: auto; }
            .page-footer { display: none; }
        }
        
        /* =========================================
           MOBILE RESPONSIVENESS (FIXED MARGINS)
           ========================================= */
        @media (max-width: 600px) {
            .container { padding: 12px; } /* Maximize screen width */
            
            /* Shift the red lines much closer to the left edge */
            .notebook-page::before { left: 25px; }
            .notebook-page::after { left: 28px; }
            
            /* Adjust header to align with new red lines */
            .page-header { padding: 25px 15px 20px 10px; }
            .chapter-title { margin-left: 30px; font-size: 20px; }
            
            /* Drastically reduce left padding to provide more reading space */
            .page-content { padding: 0 15px 0px 40px; }
            
            /* Adjust lists and indents for smaller screens */
            .page-content p::first-letter { margin-left: 15px; }
            .page-content ul { padding-left: 15px; }
            .notebook-a { padding-left: 0px; } /* Remove extra indent for answers on mobile */
            
            .page-footer { padding: 20px 15px 20px 40px; font-size: 11px; }
            
            /* Adjust print button */
            .print-btn { top: auto; bottom: 20px; right: 20px; padding: 10px 20px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <header class="app-header no-print">
        <button id="backBtn" class="back-btn" onclick="goBack()">‹ Back</button>
        <h1 id="headerTitle" class="app-title">Study Zone 📖</h1>
    </header>
    
    <main class="container">
        <div id="loader">Loading databases...</div>
        
        <!-- Grid View -->
        <div class="app-grid" id="grid"></div>

        <!-- Notebook View -->
        <button id="printBtn" class="print-btn no-print" onclick="window.print()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
            Print Notes
        </button>

        <div class="notebook-wrapper" id="notebookWrapper">
            <div class="notebook-page">
                <div class="page-header">
                    <h1 class="chapter-title" id="noteTitle">Chapter Title</h1>
                </div>
                <div class="page-content" id="noteContent">
                    <!-- Dynamic content injected here -->
                </div>
                <div class="page-footer">
                    download it from sikhyaksathi.in
                </div>
            </div>
        </div>
    </main>

    <script>
        let databases = { summary: null, keypoints: null, qna: null };

        let currentLevel = 'classes'; 
        let selectedClass = null;
        let selectedSubject = null;
        let selectedChapter = null;

        const grid = document.getElementById('grid');
        const loader = document.getElementById('loader');
        const backBtn = document.getElementById('backBtn');
        const headerTitle = document.getElementById('headerTitle');
        const notebookWrapper = document.getElementById('notebookWrapper');
        const printBtn = document.getElementById('printBtn');

        // History API Listener
        window.addEventListener('popstate', (event) => {
            if (event.state) {
                const s = event.state;
                if (s.level === 'classes') renderClasses(true);
                else if (s.level === 'subjects') {
                    selectedClass = s.selectedClass;
                    renderSubjects(s.selectedClass, true);
                }
                else if (s.level === 'chapters') {
                    selectedClass = s.selectedClass;
                    selectedSubject = s.selectedSubject;
                    renderChapters(s.selectedClass, s.selectedSubject, true);
                }
                else if (s.level === 'options') {
                    selectedClass = s.selectedClass;
                    selectedSubject = s.selectedSubject;
                    selectedChapter = s.selectedChapter;
                    renderOptions(s.selectedClass, s.selectedSubject, s.selectedChapter, true);
                }
                else if (s.level === 'notebook') {
                    selectedClass = s.selectedClass;
                    selectedSubject = s.selectedSubject;
                    selectedChapter = s.selectedChapter;
                    openNotebook(s.type, s.typeTitle, true);
                }
            } else {
                renderClasses(true);
            }
        });

        async function init() {
            try {
                const [sumRes, kpRes, qnaRes] = await Promise.all([
                    fetch('panchapadi_summary_database.json').then(r => r.json()).catch(() => null),
                    fetch('panchapadi_key_points_database.json').then(r => r.json()).catch(() => null),
                    fetch('panchapadi_qna_database.json').then(r => r.json()).catch(() => null)
                ]);

                databases.summary = sumRes;
                databases.keypoints = kpRes;
                databases.qna = qnaRes;

                loader.style.display = 'none';
                
                if (databases.summary && databases.summary.classes) {
                    renderClasses(true); 
                    history.replaceState({ level: 'classes' }, '', ''); 
                } else {
                    grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Error: Could not load class structure. Please check your JSON files.</p>';
                }
            } catch (error) {
                loader.innerText = 'Failed to load data.';
                console.error(error);
            }
        }

        function updateHeader(title, showBack) {
            headerTitle.innerText = title;
            backBtn.style.display = showBack ? 'block' : 'none';
        }

        function renderClasses(fromHistory = false) {
            currentLevel = 'classes';
            notebookWrapper.classList.remove('active');
            printBtn.style.display = 'none';
            grid.style.display = 'grid';
            updateHeader('Study Zone 📖', false);
            grid.innerHTML = '';
            
            databases.summary.classes.forEach(cls => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `
                    <div class="icon-box bg-class">🏫</div>
                    <h3>${cls.class_name}</h3>
                    <p>${cls.subjects.length} Subjects</p>
                `;
                card.onclick = () => renderSubjects(cls.class_name);
                grid.appendChild(card);
            });

            if (!fromHistory) history.pushState({ level: 'classes' }, '', '');
        }

        function renderSubjects(className, fromHistory = false) {
            currentLevel = 'subjects';
            selectedClass = className;
            notebookWrapper.classList.remove('active');
            printBtn.style.display = 'none';
            grid.style.display = 'grid';
            updateHeader(className, true);
            grid.innerHTML = '';

            const clsData = databases.summary.classes.find(c => c.class_name === className);
            if(!clsData) return;

            clsData.subjects.forEach(sub => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `
                    <div class="icon-box bg-subject">📚</div>
                    <h3>${sub.subject_name}</h3>
                    <p>${sub.chapters.length} Chapters</p>
                `;
                card.onclick = () => renderChapters(className, sub.subject_name);
                grid.appendChild(card);
            });

            if (!fromHistory) history.pushState({ level: 'subjects', selectedClass: className }, '', '');
        }

        function renderChapters(className, subjectName, fromHistory = false) {
            currentLevel = 'chapters';
            selectedSubject = subjectName;
            notebookWrapper.classList.remove('active');
            printBtn.style.display = 'none';
            grid.style.display = 'grid';
            updateHeader(subjectName, true);
            grid.innerHTML = '';

            const clsData = databases.summary.classes.find(c => c.class_name === className);
            const subData = clsData.subjects.find(s => s.subject_name === subjectName);
            if(!subData) return;

            subData.chapters.forEach(chap => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `
                    <div class="icon-box bg-chapter">📄</div>
                    <h3>${chap.chapter_name}</h3>
                    <p>Tap for details</p>
                `;
                card.onclick = () => renderOptions(className, subjectName, chap.chapter_name);
                grid.appendChild(card);
            });

            if (!fromHistory) history.pushState({ level: 'chapters', selectedClass: className, selectedSubject: subjectName }, '', '');
        }

        function renderOptions(className, subjectName, chapterName, fromHistory = false) {
            currentLevel = 'options';
            selectedChapter = chapterName;
            notebookWrapper.classList.remove('active');
            printBtn.style.display = 'none';
            grid.style.display = 'grid';
            updateHeader(chapterName, true);
            grid.innerHTML = '';

            const options = [
                { id: 'summary', title: 'ସାରାଂଶ', subtitle: 'Chapter Summary', icon: '📑', bg: 'bg-saransa' },
                { id: 'keypoints', title: 'ମୁଖ୍ୟ ବିନ୍ଦୁ', subtitle: 'Key Points', icon: '📌', bg: 'bg-mukhya' },
                { id: 'qna', title: 'ପ୍ରଶ୍ନୋତ୍ତର', subtitle: 'Q & A', icon: '💬', bg: 'bg-prasna' }
            ];

            options.forEach(opt => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `
                    <div class="icon-box ${opt.bg}">${opt.icon}</div>
                    <h3>${opt.title}</h3>
                    <p>${opt.subtitle}</p>
                `;
                card.onclick = () => openNotebook(opt.id, opt.title);
                grid.appendChild(card);
            });

            if (!fromHistory) history.pushState({ level: 'options', selectedClass: className, selectedSubject: subjectName, selectedChapter: chapterName }, '', '');
        }

        function goBack() {
            history.back(); 
        }

        function findChapterData(db, className, subjectName, chapterName) {
            if(!db || !db.classes) return null;
            const cls = db.classes.find(c => c.class_name === className);
            if(!cls) return null;
            const sub = cls.subjects.find(s => s.subject_name === subjectName);
            if(!sub) return null;
            return sub.chapters.find(c => c.chapter_name === chapterName);
        }

        function openNotebook(type, typeTitle, fromHistory = false) {
            currentLevel = 'notebook';
            grid.style.display = 'none'; 
            notebookWrapper.classList.add('active'); 
            printBtn.style.display = 'flex'; 
            updateHeader('Study Zone 📖', true); 
            window.scrollTo(0, 0); 

            const titleEl = document.getElementById('noteTitle');
            const bodyEl = document.getElementById('noteContent');
            bodyEl.innerHTML = ''; 
            
            titleEl.innerHTML = `${selectedChapter} <br><span style="font-size: 18px; font-weight: 400; color: #4a5568;">(${typeTitle})</span>`;

            let chapData = null;

            if (type === 'summary') {
                chapData = findChapterData(databases.summary, selectedClass, selectedSubject, selectedChapter);
                if (chapData && chapData.content_data && chapData.content_data.summary) {
                    bodyEl.innerHTML = chapData.content_data.summary.map(p => `<p>${p}</p>`).join('');
                } else {
                    bodyEl.innerHTML = '<p>Summary data not found for this chapter.</p>';
                }
            } 
            else if (type === 'keypoints') {
                chapData = findChapterData(databases.keypoints, selectedClass, selectedSubject, selectedChapter);
                if (chapData && chapData.content_data && chapData.content_data.key_points) {
                    const listItems = chapData.content_data.key_points.map(pt => `<li>${pt}</li>`).join('');
                    bodyEl.innerHTML = `<ul>${listItems}</ul>`;
                } else {
                    bodyEl.innerHTML = '<p>Key points data not found for this chapter.</p>';
                }
            } 
            else if (type === 'qna') {
                chapData = findChapterData(databases.qna, selectedClass, selectedSubject, selectedChapter);
                if (chapData && chapData.content_data && chapData.content_data.q_and_a) {
                    bodyEl.innerHTML = chapData.content_data.q_and_a.map(item => {
                        let markText = item.category ? item.category.replace(' QUESTIONS', '') : '';
                        let qText = markText ? `ପ୍ର: ${item.question} (${markText})` : `ପ୍ର: ${item.question}`;
                        return `
                        <div class="notebook-qna">
                            <div class="notebook-q">${qText}</div>
                            <div class="notebook-a">ଉ: ${item.answer}</div>
                        </div>
                    `}).join('');
                } else {
                    bodyEl.innerHTML = '<p>Q&A data not found for this chapter.</p>';
                }
            }

            if (!fromHistory) {
                history.pushState({ 
                    level: 'notebook', selectedClass: selectedClass, selectedSubject: selectedSubject, selectedChapter: selectedChapter, type: type, typeTitle: typeTitle 
                }, '', '');
            }
        }

        window.onload = init;
    </script>
</body>
</html>
