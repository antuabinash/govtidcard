<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Plan Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Direct PDF Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        /* --- UI STYLES (Screen Only) --- */
        :root {
            --primary: #4f46e5; --primary-hover: #4338ca;
            --bg-color: #f8fafc; --card-bg: #ffffff;
            --text-main: #0f172a; --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Nirmala UI', 'Kalinga', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 2rem; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 2px solid var(--border); }
        h1 { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
        
        .card { background: var(--card-bg); padding: 2rem; border-radius: 1rem; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 1.5rem; }
        
        label { font-weight: 600; display: block; margin-bottom: 0.5rem; font-size: 0.95rem; color: #334155; }
        input[type="number"], select { 
            width: 100%; padding: 0.85rem; border-radius: 0.6rem; border: 1px solid #cbd5e1; 
            font-size: 1rem; background: #f8fafc; outline: none; transition: 0.2s;
        }
        input[type="number"]:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); background: #ffffff; }
        
        .btn { background: var(--primary); color: white; padding: 0.85rem 1.5rem; border-radius: 0.6rem; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-secondary { background: #e2e8f0; color: #334155; }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }
        
        .period-block { background: #f1f5f9; padding: 1.5rem; border-radius: 0.85rem; border: 1px solid #cbd5e1; margin-bottom: 1.5rem; }
        .period-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 1rem; color: #1e293b; display: flex; justify-content: space-between; align-items: center; }
        
        .lesson-row { display: grid; grid-template-columns: 1fr 1fr 1.5fr 1.5fr auto; gap: 1rem; background: white; padding: 1rem; border-radius: 0.75rem; margin-bottom: 1rem; border: 1px solid var(--border); align-items: end; }
        .remove-btn { background: #fee2e2; color: #dc2626; padding: 0.75rem; border-radius: 0.5rem; cursor: pointer; border: none; font-weight: bold; transition: 0.2s; }
        .remove-btn:hover { background: #fecaca; }
        
        .hidden { display: none !important; }
        
        .spinner { border: 4px solid #e2e8f0; border-top: 4px solid var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 1rem auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Fullscreen Loading Modal during PDF creation */
        #pdf-loading-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px);
            z-index: 100000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white;
        }

        /* --- MOBILE SCREEN ADAPTATIONS --- */
        @media screen and (max-width: 768px) {
            body { padding: 1rem 0.75rem; }
            h1 { font-size: 1.5rem; }
            .card { padding: 1.25rem; }
            .setup-flex { flex-direction: column; align-items: stretch !important; gap: 0.75rem !important; }
            .setup-flex input { max-width: 100% !important; }
            .period-block { padding: 1rem; }
            .period-title { flex-direction: column; align-items: flex-start; gap: 0.75rem; font-size: 1.15rem; }
            .period-title button { width: 100%; padding: 0.75rem; }
            .lesson-row { grid-template-columns: 1fr; gap: 0.85rem; position: relative; padding: 3rem 1rem 1rem 1rem; }
            .lesson-row > div:last-child { position: absolute; top: 0.75rem; right: 0.75rem; }
            .remove-btn { padding: 0.4rem 0.75rem; font-size: 0.85rem; border-radius: 0.4rem; }
            .print-cta-card { flex-direction: column; text-align: center; gap: 1.25rem; }
            .action-buttons { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; }
            .action-buttons button { width: 100%; }
        }

        /* --- PDF & PRINT TABLE DESIGN --- */
        #pdf-export-content {
            width: 1122px; /* Standard A4 Landscape pixel canvas at 96 DPI */
            background: #ffffff;
            color: #000000;
            padding: 24px;
            font-family: 'Plus Jakarta Sans', 'Nirmala UI', 'Kalinga', sans-serif;
            box-sizing: border-box;
        }

        .pdf-header { text-align: center; margin-bottom: 12px; }
        .pdf-header h2 { margin: 0 0 6px 0; font-size: 18px; text-transform: uppercase; color: #000; font-weight: 800; }
        .pdf-meta { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; margin-bottom: 8px; border-bottom: 2px solid #000; padding-bottom: 4px; color: #000; }
        
        .pdf-table { width: 100%; border-collapse: collapse; font-size: 9.5px; table-layout: fixed; color: #000; }
        .pdf-table thead { display: table-header-group; }
        .pdf-table tbody { page-break-inside: avoid; break-inside: avoid; } /* Smart Auto-Break: never splits period */
        .pdf-table th, .pdf-table td { border: 1px solid #000; padding: 5px; vertical-align: top; word-wrap: break-word; line-height: 1.25; }
        .pdf-table th { background-color: #f1f5f9 !important; font-weight: bold; text-align: left; }
        
        /* Calculated Column Widths */
        .col-period { width: 3.5%; text-align: center; font-weight: bold; }
        .col-class { width: 7.5%; }
        .col-topic { width: 10%; }
        .col-comp { width: 8%; }
        .col-lo { width: 9%; }
        .col-aditi { width: 9%; }
        .col-bodha { width: 15%; } /* Extra width for dense text */
        .col-abhyasa { width: 9%; }
        .col-prayoga { width: 10.5%; }
        .col-prasara { width: 10.5%; }
        .col-tlm { width: 8%; }
        
        .pdf-text { margin-bottom: 3px; }
        .pdf-text b { font-size: 9px; }

        @media print {
            .no-print, .container { display: none !important; }
            #pdf-export-content { position: static !important; display: block !important; width: 100% !important; padding: 0 !important; }
            @page { size: A4 landscape; margin: 6mm; }
        }
    </style>
</head>
<body>

    <!-- UI SECTION -->
    <div class="container no-print">
        <header>
            <h1>🖨️ Lesson Plan Generator</h1>
        </header>

        <div id="status-card" class="card" style="text-align: center;">
            <div class="spinner"></div>
            <h3 id="status-text">Loading Database...</h3>
        </div>

        <div id="setup-card" class="card hidden">
            <h2 style="margin-bottom: 1rem;">Setup Daily Routine</h2>
            <label>How many teaching periods do you have today?</label>
            <div class="setup-flex" style="display: flex; gap: 1rem; align-items: center;">
                <input type="number" id="numPeriods" min="1" max="10" value="7" style="max-width: 150px;">
                <button class="btn" onclick="buildPeriodForms()">Start Planning</button>
            </div>
        </div>

        <div id="builder-area" class="hidden">
            <div id="periods-container"></div>
            
            <div class="card print-cta-card" style="display: flex; justify-content: space-between; align-items: center; background: #e0e7ff; border-color: var(--primary);">
                <div>
                    <h3 style="color: var(--primary); margin-bottom: 0.25rem;">Plan Complete?</h3>
                    <p style="font-size: 0.95rem; color: #4338ca;">Download a crystal-clear A4 Landscape PDF directly.</p>
                </div>
                <div class="action-buttons" style="display: flex; gap: 0.5rem;">
                    <button id="btnDownload" class="btn btn-success" onclick="downloadDirectPDF()">📥 Download Direct PDF</button>
                    <button class="btn" onclick="nativePrintPDF()">🖨️ Print / Vector PDF</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FULLSCREEN LOADING MODAL -->
    <div id="pdf-loading-modal" class="hidden">
        <div class="spinner" style="border-color: rgba(255,255,255,0.2); border-top-color: #fff; width: 50px; height: 50px; margin-bottom: 1.5rem;"></div>
        <h2 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem;">Rendering High-Res PDF...</h2>
        <p style="color: #cbd5e1; font-size: 0.95rem;">Compiling Panchapadi steps and Odia text.</p>
    </div>

    <!-- RENDER CONTAINER (Hidden until PDF generation) -->
    <div id="pdf-export-content" style="display: none;"></div>

    <script>
        let db = {};
        let classList = [];

        document.addEventListener("DOMContentLoaded", () => {
            fetch('master_lesson_database.json')
                .then(response => response.json())
                .then(data => {
                    db = data;
                    classList = Object.keys(db).sort();
                    document.getElementById('status-card').classList.add('hidden');
                    document.getElementById('setup-card').classList.remove('hidden');
                })
                .catch(err => {
                    document.getElementById('status-text').innerHTML = "❌ Failed to load database.<br><span style='font-size:14px; color:gray;'>Make sure master_lesson_database.json is in the same folder.</span>";
                    document.querySelector('.spinner').style.display = 'none';
                });
        });

        function buildPeriodForms() {
            const num = parseInt(document.getElementById('numPeriods').value);
            if (num < 1 || isNaN(num)) return;

            const container = document.getElementById('periods-container');
            container.innerHTML = '';

            for (let i = 1; i <= num; i++) {
                const pBlock = document.createElement('div');
                pBlock.className = 'period-block';
                pBlock.innerHTML = `
                    <div class="period-title">
                        School Period ${i}
                        <button class="btn btn-secondary" onclick="addLessonRow(${i})">+ Add Class</button>
                    </div>
                    <div id="rows-container-${i}"></div>
                `;
                container.appendChild(pBlock);
                addLessonRow(i);
            }
            document.getElementById('setup-card').classList.add('hidden');
            document.getElementById('builder-area').classList.remove('hidden');
        }

        function addLessonRow(periodNum) {
            const container = document.getElementById(`rows-container-${periodNum}`);
            const rowId = `row-${periodNum}-${Date.now()}`;
            const row = document.createElement('div');
            row.className = 'lesson-row';
            row.id = rowId;
            row.innerHTML = `
                <div>
                    <label>Class</label>
                    <select class="sel-class" onchange="updateSubjects('${rowId}')">
                        <option value="">Select Class...</option>
                        ${classList.map(c => `<option value="${c}">${c.replace('_', ' ')}</option>`).join('')}
                    </select>
                </div>
                <div><label>Subject</label><select class="sel-subj" onchange="updateChapters('${rowId}')" disabled><option>...</option></select></div>
                <div><label>Chapter</label><select class="sel-chap" onchange="updateLessons('${rowId}')" disabled><option>...</option></select></div>
                <div><label>Lesson / Period</label><select class="sel-less" disabled><option>...</option></select></div>
                <div><button class="remove-btn" onclick="document.getElementById('${rowId}').remove()">✖ Remove</button></div>
            `;
            container.appendChild(row);
        }

        function updateSubjects(rowId) {
            const row = document.getElementById(rowId);
            const cls = row.querySelector('.sel-class').value;
            resetSelect(row.querySelector('.sel-chap')); resetSelect(row.querySelector('.sel-less'));
            if (!cls) return resetSelect(row.querySelector('.sel-subj'));
            populateSelect(row.querySelector('.sel-subj'), Object.keys(db[cls] || {}), "Select Subject...");
        }

        function updateChapters(rowId) {
            const row = document.getElementById(rowId);
            const cls = row.querySelector('.sel-class').value;
            const subj = row.querySelector('.sel-subj').value;
            resetSelect(row.querySelector('.sel-less'));
            if (!subj) return resetSelect(row.querySelector('.sel-chap'));
            populateSelect(row.querySelector('.sel-chap'), Object.keys(db[cls][subj] || {}), "Select Chapter...");
        }

        function updateLessons(rowId) {
            const row = document.getElementById(rowId);
            const cls = row.querySelector('.sel-class').value;
            const subj = row.querySelector('.sel-subj').value;
            const chap = row.querySelector('.sel-chap').value;
            const lessSel = row.querySelector('.sel-less');
            if (!chap) return resetSelect(lessSel);
            
            const lessonsData = db[cls][subj][chap] || {};
            const lessons = Array.isArray(lessonsData) ? lessonsData.map((l, i) => i) : Object.keys(lessonsData);
            
            lessSel.innerHTML = '<option value="">Select Lesson...</option>';
            lessons.forEach(key => {
                const name = Array.isArray(lessonsData) ? lessonsData[key].Period : key;
                const opt = document.createElement('option');
                opt.value = key; opt.textContent = name;
                lessSel.appendChild(opt);
            });
            lessSel.disabled = false;
        }

        function populateSelect(selectElem, items, placeholder) {
            selectElem.innerHTML = `<option value="">${placeholder}</option>`;
            items.forEach(item => {
                const opt = document.createElement('option'); opt.value = item; opt.textContent = item;
                selectElem.appendChild(opt);
            });
            selectElem.disabled = false;
        }

        function resetSelect(selectElem) { selectElem.innerHTML = '<option>...</option>'; selectElem.disabled = true; }

        function formatPrint(text) {
            if (!text || text === 'nan') return '';
            let cleaned = String(text).replace(/\|/g, '<br>').replace(/👨‍🏫/g, '').replace(/🧑‍🎓/g, '');
            return `<div class="pdf-text">${cleaned}</div>`;
        }

        function formatLO(text) {
            if (!text || text === 'nan') return '';
            let cleaned = String(text).split(/\s*\|\s*\[Codes:/)[0];
            cleaned = cleaned.replace(/\|/g, '<br>').replace(/✓/g, '').trim();
            return `<div class="pdf-text">${cleaned}</div>`;
        }

        function formatPanchapadi(text) {
            if (!text || text === 'nan') return '';
            let teacherPart = String(text).split(/🧑‍🎓?\s*ଶିକ୍ଷାର୍ଥୀଙ୍କ ପ୍ରତିକ୍ରିୟା/)[0];
            teacherPart = teacherPart.replace(/👨‍🏫?\s*ଶିକ୍ଷକଙ୍କ କାର୍ଯ୍ୟ \(TEACHER\)\s*\|?/g, '');
            let cleaned = teacherPart.replace(/\|/g, '<br>').trim();
            if (cleaned.endsWith('<br>')) cleaned = cleaned.substring(0, cleaned.length - 4).trim();
            return `<div class="pdf-text">${cleaned}</div>`;
        }

        function buildPDFHTML() {
            const container = document.getElementById('pdf-export-content');
            container.innerHTML = '';
            
            const periodBlocks = document.querySelectorAll('.period-block');
            let validPeriods = [];
            
            periodBlocks.forEach((block, index) => {
                const pNum = index + 1;
                const rows = block.querySelectorAll('.lesson-row');
                let rowDataList = [];
                rows.forEach(row => {
                    const cls = row.querySelector('.sel-class').value;
                    const subj = row.querySelector('.sel-subj').value;
                    const chap = row.querySelector('.sel-chap').value;
                    const lessKey = row.querySelector('.sel-less').value;
                    if (cls && subj && chap && lessKey !== "") rowDataList.push({ cls, subj, chap, lessKey });
                });
                if (rowDataList.length > 0) validPeriods.push({ pNum, rowDataList });
            });

            if (validPeriods.length === 0) return false;

            container.innerHTML = `
                <div class="pdf-header">
                    <h2>Daily Lesson Plan (ଦୈନିକ ପାଠ୍ୟ ଖସଡ଼ା)</h2>
                    <div class="pdf-meta">
                        <span>Teacher Name: _______________________</span>
                        <span>Date: ____/____/20___</span>
                        <span>Day: _______________</span>
                    </div>
                </div>
                <table class="pdf-table">
                    <thead>
                        <tr>
                            <th class="col-period">Prd</th>
                            <th class="col-class">Class/Subj</th>
                            <th class="col-topic">Topic</th>
                            <th class="col-comp">Competency</th>
                            <th class="col-lo">Learning Outcome</th>
                            <th class="col-aditi">ଅଧୀତି (Adhiti)</th>
                            <th class="col-bodha">ବୋଧ (Bodha)</th>
                            <th class="col-abhyasa">ଅଭ୍ୟାସ (Abhyasa)</th>
                            <th class="col-prayoga">ପ୍ରୟୋଗ (Prayoga)</th>
                            <th class="col-prasara">ପ୍ରସାର (Prasara)</th>
                            <th class="col-tlm">TLM</th>
                        </tr>
                    </thead>
                </table>
            `;

            const table = container.querySelector('table');

            validPeriods.forEach(period => {
                const tbody = document.createElement('tbody');
                period.rowDataList.forEach((rData, rIndex) => {
                    const plan = db[rData.cls][rData.subj][rData.chap][rData.lessKey];
                    const p = plan.Panchapadi || {};
                    const tr = document.createElement('tr');
                    
                    if (rIndex === 0) tr.innerHTML += `<td class="col-period" rowspan="${period.rowDataList.length}">${period.pNum}</td>`;

                    tr.innerHTML += `
                        <td class="col-class"><b>${rData.cls.replace('_', ' ')}</b><br>${rData.subj}</td>
                        <td class="col-topic"><b>${rData.chap}</b><br><br>${plan.Topic || ''}</td>
                        <td class="col-comp">${formatPrint(plan.Competency)}</td>
                        <td class="col-lo">${formatLO(plan.LearningOutcomes)}</td>
                        <td class="col-aditi">${formatPanchapadi(p.Aditi)}</td>
                        <td class="col-bodha">${formatPanchapadi(p.Bodha)}</td>
                        <td class="col-abhyasa">${formatPanchapadi(p.Abhyasa)}</td>
                        <td class="col-prayoga">${formatPanchapadi(p.Prayoga)}</td>
                        <td class="col-prasara">${formatPanchapadi(p.Prasara)}</td>
                        <td class="col-tlm">${formatPrint(plan.TLM)}</td>
                    `;
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
            });

            return true;
        }

        // --- DIRECT PDF DOWNLOAD ENGINE ---
        async function downloadDirectPDF() {
            if (!buildPDFHTML()) return alert("Please fully select at least one lesson plan.");

            const modal = document.getElementById('pdf-loading-modal');
            const element = document.getElementById('pdf-export-content');
            
            modal.classList.remove('hidden');

            // Set coordinates to (0,0) so html2canvas renders the content cleanly
            element.style.display = 'block';
            element.style.position = 'fixed';
            element.style.top = '0';
            element.style.left = '0';
            element.style.zIndex = '9999'; // Underneath the modal (z-index 100000)

            // Allow the browser a brief moment to calculate layout and fonts
            await new Promise(resolve => setTimeout(resolve, 300));

            const opt = {
                margin:       [6, 6, 6, 6],
                filename:     'Daily_Lesson_Plan.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { 
                    scale: 2.5, // Crisp 240 DPI on a 16GB PC
                    useCORS: true, 
                    logging: false,
                    scrollX: 0,
                    scrollY: 0
                },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' },
                pagebreak:    { mode: ['css', 'legacy'], avoid: 'tbody' }
            };

            try {
                await html2pdf().set(opt).from(element).save();
            } catch (err) {
                console.error(err);
                alert("An error occurred while generating the PDF.");
            } finally {
                element.style.display = 'none';
                element.style.position = '';
                element.style.top = '';
                element.style.left = '';
                element.style.zIndex = '';
                modal.classList.add('hidden');
            }
        }

        function nativePrintPDF() {
            if (!buildPDFHTML()) return alert("Please fully select at least one lesson plan.");
            const element = document.getElementById('pdf-export-content');
            element.style.display = 'block';
            window.print();
            element.style.display = 'none';
        }
    </script>
</body>
</html>
