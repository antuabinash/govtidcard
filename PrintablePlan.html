<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lesson Plan Generator</title>
    
    <!-- Embed Universal Fonts to Guarantee Flawless Odia Screen Rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Oriya:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- High-Res Snapshot & PDF Assembler -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        /* --- PREMIUM NATIVE UI STYLES --- */
        :root {
            --primary: #4f46e5; 
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6; /* Softer, cooler app background */
            --card-bg: #ffffff;
            --text-main: #111827; 
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --shadow-soft: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --shadow-inner: inset 0 2px 4px 0 rgba(0, 0, 0, 0.03);
            --radius-lg: 20px;
            --radius-md: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Noto Sans Oriya', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            min-height: 100vh; 
        }

        /* Glassmorphism Sticky Header */
        header { 
            position: sticky; top: 0; z-index: 50;
            display: flex; justify-content: space-between; align-items: center; 
            padding: 1.25rem 2rem; 
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        h1 { font-size: 1.5rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; display: flex; align-items: center; gap: 0.5rem; }

        .container { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem; }
        
        .card { 
            background: var(--card-bg); padding: 2rem; 
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-soft); 
            margin-bottom: 1.5rem; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        label { font-weight: 700; display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #374151; letter-spacing: 0.3px; }
        
        /* Modern Inputs */
        input[type="text"], input[type="number"], input[type="date"], select { 
            width: 100%; padding: 0.85rem 1.25rem; 
            border-radius: var(--radius-md); 
            border: 1px solid transparent; 
            font-size: 1rem; font-weight: 500;
            background: #f9fafb; color: #1f2937;
            outline: none; transition: all 0.25s ease;
            box-shadow: var(--shadow-inner);
        }
        input:focus, select:focus { 
            background: #ffffff; 
            border-color: var(--primary); 
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); 
        }
        
        /* Native-feel Buttons */
        .btn { 
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white; padding: 1rem 1.75rem; 
            border-radius: var(--radius-md); font-weight: 700; 
            cursor: pointer; border: none; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }
        .btn:active { transform: scale(0.97); box-shadow: 0 2px 6px rgba(79, 70, 229, 0.2); }
        
        .btn-secondary { 
            background: #f3f4f6; color: #374151; 
            padding: 0.85rem 1.25rem; font-size: 0.95rem; font-weight: 700;
            box-shadow: none;
        }
        .btn-secondary:hover { background: #e5e7eb; }
        .btn-secondary:active { transform: scale(0.97); }

        .btn-danger { background: #fee2e2; color: #dc2626; box-shadow: none; }
        .btn-danger:hover { background: #fca5a5; color: #991b1b; }
        
        /* Profile Header */
        #profile-header-card { 
            display: flex; justify-content: space-between; align-items: center; 
            background: linear-gradient(to right, #e0e7ff, #f3e8ff); 
            border: none; padding: 1.5rem 2rem;
        }
        #profile-info { display: flex; flex-direction: column; gap: 0.15rem; }
        #display-school { font-weight: 800; font-size: 1.2rem; color: var(--primary); }
        #display-teacher { font-size: 0.95rem; color: #6b21a8; font-weight: 600;}

        /* Period Builder Blocks */
        .period-block { 
            background: #ffffff; padding: 1.5rem; 
            border-radius: var(--radius-lg); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.02); 
            border: 1px solid var(--border); margin-bottom: 1.5rem; 
        }
        .period-title { 
            font-size: 1.25rem; font-weight: 800; color: #111827; 
            display: flex; justify-content: space-between; align-items: center; 
            padding-bottom: 1rem; margin-bottom: 1rem;
            border-bottom: 2px dashed #f3f4f6;
        }
        
        .lesson-row { 
            display: grid; grid-template-columns: 1fr 1fr 1.5fr 1.5fr auto; gap: 1rem; 
            background: #f8fafc; padding: 1.25rem; border-radius: var(--radius-md); 
            margin-bottom: 1rem; border: 1px solid #f1f5f9; align-items: end; 
        }
        .remove-btn { 
            background: #fee2e2; color: #ef4444; padding: 0.85rem; 
            border-radius: 0.6rem; cursor: pointer; border: none; 
            font-weight: bold; transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .remove-btn:active { transform: scale(0.92); background: #fca5a5; }
        
        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        
        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(17, 24, 39, 0.6); backdrop-filter: blur(8px);
            z-index: 10000; display: flex; align-items: center; justify-content: center;
            padding: 1rem;
        }
        .modal-content { 
            background: white; padding: 2rem; border-radius: var(--radius-lg); 
            width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); 
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .modal-header h2 { font-size: 1.4rem; font-weight: 800; }
        .close-modal { background: #f3f4f6; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .close-modal:active { background: #e5e7eb; transform: scale(0.9); }

        .hidden { display: none !important; }
        
        .spinner { border: 4px solid #f3f4f6; border-top: 4px solid var(--primary); border-radius: 50%; width: 36px; height: 36px; animation: spin 0.8s linear infinite; margin: 0 auto 1rem auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- PREVIEW AND PRINT STYLES --- */
        #preview-wrapper {
            background: white; padding: 1.5rem; border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-soft); overflow-x: auto; margin-bottom: 1.5rem; 
        }

        #pdf-preview-content, #temp-pdf-export { 
            min-width: 1000px; 
            background: white; color: black; font-family: 'Plus Jakarta Sans', 'Noto Sans Oriya', sans-serif;
        }
        
        .pdf-text { font-family: 'Plus Jakarta Sans', 'Noto Sans Oriya', sans-serif; margin-bottom: 3px; }
        .pdf-header { text-align: center; margin-bottom: 12px; width: 100%; }
        .pdf-header h2 { margin: 0 0 4px 0; font-size: 18px; text-transform: uppercase; color: #000; font-weight: 800; }
        .pdf-school { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #374151; }
        .pdf-meta { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; margin-bottom: 4px; border-bottom: 2px solid #000; padding-bottom: 4px; color: #000; }
        
        .pdf-table { width: 100%; border-collapse: collapse; font-size: 9.5px; table-layout: fixed; color: #000; margin-bottom: 10px; }
        .pdf-table thead { display: table-header-group; } 
        .pdf-table tbody tr { page-break-inside: avoid !important; break-inside: avoid !important; } 
        .pdf-table th, .pdf-table td { border: 1px solid #000; padding: 5px; vertical-align: top; line-height: 1.3; word-wrap: break-word; word-break: normal; overflow-wrap: break-word; }
        .pdf-table th { background-color: #f8fafc !important; font-weight: bold; text-align: left; }
        th.print-header-cell { background-color: white !important; border: none !important; padding: 0 0 10px 0 !important; }
        .col-period { text-align: center; font-weight: bold; }
        .pdf-text b { font-size: 9px; }

        .html2pdf__page-break { height: 0; width: 100%; page-break-before: always; border: none; margin: 0; padding: 0; }
        .pdf-page { width: 1122px; padding: 20px; background: white; box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Noto Sans Oriya', sans-serif; }

        /* --- MOBILE SCREEN ADAPTATIONS --- */
        @media screen and (max-width: 768px) {
            header { padding: 1rem 1.25rem; }
            .container { padding: 1.5rem 1rem; }
            h1 { font-size: 1.3rem; }
            .card { padding: 1.5rem; }
            #profile-header-card { flex-direction: column; align-items: flex-start; gap: 1.25rem; }
            #profile-header-card button { width: 100%; }
            .setup-grid { grid-template-columns: 1fr; gap: 1rem; }
            .period-block { padding: 1.25rem; }
            .period-title { flex-direction: column; align-items: flex-start; gap: 1rem; font-size: 1.15rem; }
            .period-title button { width: 100%; padding: 0.85rem; }
            .lesson-row { grid-template-columns: 1fr; gap: 1rem; position: relative; padding: 3.5rem 1rem 1.25rem 1rem; }
            .lesson-row > div:last-child { position: absolute; top: 1rem; right: 1rem; }
            .remove-btn { padding: 0.5rem 0.85rem; font-size: 0.85rem; }
            .print-cta-card { flex-direction: column; text-align: center; gap: 1.5rem; }
            .print-cta-card button { width: 100%; }
            .action-bar { flex-direction: column; }
            .action-bar button { width: 100%; }
        }

        /* --- PRINT OVERRIDES --- */
        @media print {
            .no-print, .container:not(#preview-area), .modal-overlay, #temp-pdf-export { display: none !important; }
            #preview-wrapper { padding: 0; box-shadow: none; border: none; margin: 0; overflow: visible; }
            #pdf-preview-content { min-width: 100%; width: 100% !important; display: block !important; }
            @page { size: A4 landscape; margin: 6mm; }
            body { background: white; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <!-- UI HEADER -->
    <header class="no-print">
        <h1>🎒 LessonGuru</h1>
    </header>

    <!-- MAIN APP CONTAINER -->
    <div class="container no-print" id="main-container">
        
        <div id="status-card" class="card" style="text-align: center;">
            <div class="spinner"></div>
            <h3 id="status-text" style="color: #4b5563;">Syncing Syllabus...</h3>
        </div>

        <!-- Setup Card -->
        <div id="setup-card" class="card hidden">
            <h2 style="margin-bottom: 1.25rem; font-weight: 800;">Plan Settings</h2>
            <div class="setup-grid">
                <div><label>School Name</label><input type="text" id="schoolName" placeholder="e.g. Govt. High School..."></div>
                <div><label>Teacher Name</label><input type="text" id="teacherName" placeholder="e.g. Abinash Mahapatra..."></div>
                <div><label>Plan Date</label><input type="date" id="planDate"></div>
                <div><label>Teaching Periods Today</label><input type="number" id="numPeriods" min="1" max="10" value="7"></div>
            </div>
            <button class="btn" style="width: 100%; margin-top: 1rem;" onclick="buildPeriodForms()">Create Workspace</button>
        </div>

        <!-- Builder Area -->
        <div id="builder-area" class="hidden">
            <div id="profile-header-card" class="card">
                <div id="profile-info">
                    <div id="display-school">School Name</div>
                    <div id="display-teacher">Teacher Name</div>
                </div>
                <button class="btn btn-secondary" onclick="openProfileModal()">⚙️ Settings</button>
            </div>

            <div id="periods-container"></div>
            
            <div class="card print-cta-card" style="display: flex; justify-content: space-between; align-items: center; border-color: var(--primary); background: white;">
                <div>
                    <h3 style="color: #111827; margin-bottom: 0.25rem; font-weight: 800;">Ready to Export?</h3>
                    <p style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 0.75rem;">Generate your final plan for sharing or printing.</p>
                    <button class="btn btn-danger" onclick="clearSavedPlan()">🗑️ Reset Everything</button>
                </div>
                <button class="btn" onclick="generatePlanPreview()">
                    ✨ View Final Plan
                </button>
            </div>
        </div>
    </div>

    <!-- PREVIEW & ACTION AREA -->
    <div class="container hidden" id="preview-area">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;" class="no-print">
            <h2 style="font-size: 1.5rem; font-weight: 800;">📄 Print Preview</h2>
            <button class="btn btn-secondary" onclick="backToEdit()" style="padding: 0.6rem 1rem;">✕ Close</button>
        </div>

        <!-- Scrollable Wrapper -->
        <div id="preview-wrapper">
            <div id="pdf-preview-content"></div>
        </div>

        <!-- Sticky Bottom Action Bar -->
        <div class="card action-bar no-print" style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); position: sticky; bottom: 1rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);">
            <button class="btn btn-secondary" onclick="backToEdit()">✏️ Edit Plan</button>
            <button class="btn" style="background: #10b981; color: white;" onclick="window.print()">🖨️ Print Direct</button>
            <button id="btnShare" class="btn" onclick="sharePlanViaApp()">📤 Share PDF</button>
        </div>
    </div>

    <!-- HIDDEN EXPORT CONTAINER (For Image Snapshots) -->
    <div id="temp-pdf-export" style="display: none;"></div>

    <!-- PROFILE MODAL -->
    <div id="edit-profile-modal" class="modal-overlay hidden no-print">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Plan Settings</h2>
                <button class="close-modal" onclick="closeProfileModal()">✕</button>
            </div>
            <div class="setup-grid" style="margin-bottom: 1.5rem;">
                <div><label>School Name</label><input type="text" id="modalSchoolName"></div>
                <div><label>Teacher Name</label><input type="text" id="modalTeacherName"></div>
                <div><label>Plan Date</label><input type="date" id="modalPlanDate"></div>
                <div><label>Teaching Periods</label><input type="number" id="modalNumPeriods" min="1" max="10"></div>
            </div>
            <button class="btn" style="width: 100%;" onclick="saveUpdatedProfile()">Apply Changes</button>
        </div>
    </div>

    <script>
        let db = {};
        let classList = [];

        document.addEventListener("DOMContentLoaded", () => {
            // GLOBALLY FORCE TODAY's DATE on boot-up
            document.getElementById('planDate').valueAsDate = new Date();

            fetch('master_lesson_database.json')
                .then(response => response.json())
                .then(data => {
                    db = data;
                    classList = Object.keys(db).sort();
                    document.getElementById('status-card').classList.add('hidden');
                    
                    if (!loadPlanFromStorage()) {
                        document.getElementById('setup-card').classList.remove('hidden');
                    }
                })
                .catch(err => {
                    document.getElementById('status-text').innerHTML = "❌ Failed to load database.<br><span style='font-size:14px; color:gray;'>Ensure JSON is in the folder.</span>";
                    document.querySelector('.spinner').style.display = 'none';
                });
        });

        function savePlanToStorage() {
            const numPeriods = document.getElementById('numPeriods').value;
            let validPeriods = [];
            document.querySelectorAll('.period-block').forEach(block => {
                let rowDataList = [];
                block.querySelectorAll('.lesson-row').forEach(row => {
                    rowDataList.push({
                        cls: row.querySelector('.sel-class').value,
                        subj: row.querySelector('.sel-subj').value,
                        chap: row.querySelector('.sel-chap').value,
                        lessKey: row.querySelector('.sel-less').value
                    });
                });
                validPeriods.push(rowDataList);
            });

            localStorage.setItem('lessonGuruAutoSave', JSON.stringify({
                schoolName: document.getElementById('schoolName').value,
                teacherName: document.getElementById('teacherName').value,
                // We intentionally SAVE the date, but we will explicitly IGNORE it on boot.
                planDate: document.getElementById('planDate').value,
                numPeriods: numPeriods,
                periods: validPeriods
            }));
        }

        function loadPlanFromStorage() {
            const saved = localStorage.getItem('lessonGuruAutoSave');
            if (!saved) return false;
            try {
                const data = JSON.parse(saved);
                
                // Load texts
                if(data.schoolName) document.getElementById('schoolName').value = data.schoolName;
                if(data.teacherName) document.getElementById('teacherName').value = data.teacherName;
                
                // CRITICAL FIX: We do NOT load data.planDate here. 
                // We let DOMContentLoaded's 'new Date()' remain active so it's always today!
                
                updateUIHeader(); 

                if (!data.periods || data.periods.length === 0) return false;
                
                document.getElementById('numPeriods').value = data.numPeriods;
                const container = document.getElementById('periods-container');
                container.innerHTML = '';

                data.periods.forEach((rowsData, index) => {
                    const i = index + 1;
                    const pBlock = document.createElement('div');
                    pBlock.className = 'period-block';
                    pBlock.innerHTML = `
                        <div class="period-title">School Period ${i}<button class="btn btn-secondary" onclick="addLessonRow(${i}); savePlanToStorage();" style="padding: 0.5rem 1rem;">+ Add Class</button></div>
                        <div id="rows-container-${i}"></div>
                    `;
                    container.appendChild(pBlock);
                    if (rowsData.length === 0) addLessonRow(i);
                    else rowsData.forEach(r => addLessonRow(i, r));
                });
                document.getElementById('builder-area').classList.remove('hidden');
                return true;
            } catch(e) { return false; }
        }

        function updateUIHeader() {
            document.getElementById('display-school').innerText = document.getElementById('schoolName').value || "No School Defined";
            document.getElementById('display-teacher').innerText = document.getElementById('teacherName').value || "No Name Defined";
        }

        function clearSavedPlan() {
            if(confirm("Are you sure you want to reset? This will wipe your daily schedule.")) {
                const sName = document.getElementById('schoolName').value;
                const tName = document.getElementById('teacherName').value;
                localStorage.removeItem('lessonGuruAutoSave');
                document.getElementById('schoolName').value = sName;
                document.getElementById('teacherName').value = tName;
                document.getElementById('planDate').valueAsDate = new Date(); 
                document.getElementById('builder-area').classList.add('hidden');
                document.getElementById('setup-card').classList.remove('hidden');
                document.getElementById('periods-container').innerHTML = '';
            }
        }

        function openProfileModal() {
            document.getElementById('modalSchoolName').value = document.getElementById('schoolName').value;
            document.getElementById('modalTeacherName').value = document.getElementById('teacherName').value;
            document.getElementById('modalPlanDate').value = document.getElementById('planDate').value;
            document.getElementById('modalNumPeriods').value = document.getElementById('numPeriods').value; 
            document.getElementById('edit-profile-modal').classList.remove('hidden');
        }

        function closeProfileModal() { document.getElementById('edit-profile-modal').classList.add('hidden'); }

        function adjustPeriods(newNum) {
            const container = document.getElementById('periods-container');
            const currentBlocks = container.querySelectorAll('.period-block');
            const currentNum = currentBlocks.length;

            if (newNum > currentNum) {
                for (let i = currentNum + 1; i <= newNum; i++) {
                    const pBlock = document.createElement('div');
                    pBlock.className = 'period-block';
                    pBlock.innerHTML = `<div class="period-title">School Period ${i}<button class="btn btn-secondary" onclick="addLessonRow(${i}); savePlanToStorage();" style="padding: 0.5rem 1rem;">+ Add Class</button></div><div id="rows-container-${i}"></div>`;
                    container.appendChild(pBlock);
                    addLessonRow(i);
                }
            } else if (newNum < currentNum) {
                for (let i = currentNum; i > newNum; i--) container.removeChild(currentBlocks[i - 1]);
            }
        }

        function saveUpdatedProfile() {
            document.getElementById('schoolName').value = document.getElementById('modalSchoolName').value;
            document.getElementById('teacherName').value = document.getElementById('modalTeacherName').value;
            document.getElementById('planDate').value = document.getElementById('modalPlanDate').value;
            const updatedPeriods = parseInt(document.getElementById('modalNumPeriods').value);
            if (!isNaN(updatedPeriods) && updatedPeriods >= 1) {
                document.getElementById('numPeriods').value = updatedPeriods;
                adjustPeriods(updatedPeriods);
            }
            updateUIHeader(); savePlanToStorage(); closeProfileModal();
        }

        function buildPeriodForms() {
            const num = parseInt(document.getElementById('numPeriods').value);
            if (num < 1 || isNaN(num)) return;
            const container = document.getElementById('periods-container');
            container.innerHTML = '';
            for (let i = 1; i <= num; i++) {
                const pBlock = document.createElement('div');
                pBlock.className = 'period-block';
                pBlock.innerHTML = `<div class="period-title">School Period ${i}<button class="btn btn-secondary" onclick="addLessonRow(${i}); savePlanToStorage();" style="padding: 0.5rem 1rem;">+ Add Class</button></div><div id="rows-container-${i}"></div>`;
                container.appendChild(pBlock);
                addLessonRow(i);
            }
            updateUIHeader(); 
            document.getElementById('setup-card').classList.add('hidden');
            document.getElementById('builder-area').classList.remove('hidden');
            savePlanToStorage();
        }

        function addLessonRow(periodNum, presetData = null) {
            const container = document.getElementById(`rows-container-${periodNum}`);
            const rowId = `row-${periodNum}-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`;
            const row = document.createElement('div');
            row.className = 'lesson-row';
            row.id = rowId;
            row.innerHTML = `
                <div><label>Class</label><select class="sel-class" onchange="updateSubjects('${rowId}'); savePlanToStorage();"><option value="">Select Class...</option>${classList.map(c => `<option value="${c}">${c.replace('_', ' ')}</option>`).join('')}</select></div>
                <div><label>Subject</label><select class="sel-subj" onchange="updateChapters('${rowId}'); savePlanToStorage();" disabled><option>...</option></select></div>
                <div><label>Chapter</label><select class="sel-chap" onchange="updateLessons('${rowId}'); savePlanToStorage();" disabled><option>...</option></select></div>
                <div><label>Lesson / Period</label><select class="sel-less" onchange="savePlanToStorage();" disabled><option>...</option></select></div>
                <div><button class="remove-btn" onclick="document.getElementById('${rowId}').remove(); savePlanToStorage();">✖</button></div>
            `;
            container.appendChild(row);

            if (presetData && presetData.cls) {
                row.querySelector('.sel-class').value = presetData.cls; updateSubjects(rowId);
                if (presetData.subj) {
                    row.querySelector('.sel-subj').value = presetData.subj; updateChapters(rowId);
                    if (presetData.chap) {
                        row.querySelector('.sel-chap').value = presetData.chap; updateLessons(rowId);
                        if (presetData.lessKey) row.querySelector('.sel-less').value = presetData.lessKey;
                    }
                }
            }
        }

        function updateSubjects(rowId) {
            const row = document.getElementById(rowId);
            const cls = row.querySelector('.sel-class').value;
            resetSelect(row.querySelector('.sel-chap')); resetSelect(row.querySelector('.sel-less'));
            if (!cls) return resetSelect(row.querySelector('.sel-subj'));
            populateSelect(row.querySelector('.sel-subj'), Object.keys(db[cls] || {}), "Select Subject...");
        }

        function updateChapters(rowId) {
            const row = document.getElementById(rowId);
            const cls = row.querySelector('.sel-class').value;
            const subj = row.querySelector('.sel-subj').value;
            resetSelect(row.querySelector('.sel-less'));
            if (!subj) return resetSelect(row.querySelector('.sel-chap'));
            populateSelect(row.querySelector('.sel-chap'), Object.keys(db[cls][subj] || {}), "Select Chapter...");
        }

        function updateLessons(rowId) {
            const row = document.getElementById(rowId);
            const cls = row.querySelector('.sel-class').value;
            const subj = row.querySelector('.sel-subj').value;
            const chap = row.querySelector('.sel-chap').value;
            const lessSel = row.querySelector('.sel-less');
            if (!chap) return resetSelect(lessSel);
            
            const lessonsData = db[cls][subj][chap] || {};
            const lessons = Array.isArray(lessonsData) ? lessonsData.map((l, i) => i) : Object.keys(lessonsData);
            
            lessSel.innerHTML = '<option value="">Select Lesson...</option>';
            lessons.forEach(key => {
                const name = Array.isArray(lessonsData) ? lessonsData[key].Period : key;
                const opt = document.createElement('option'); opt.value = key; opt.textContent = name;
                lessSel.appendChild(opt);
            });
            lessSel.disabled = false;
        }

        function populateSelect(selectElem, items, placeholder) {
            selectElem.innerHTML = `<option value="">${placeholder}</option>`;
            items.forEach(item => { const opt = document.createElement('option'); opt.value = item; opt.textContent = item; selectElem.appendChild(opt); });
            selectElem.disabled = false;
        }
        function resetSelect(selectElem) { selectElem.innerHTML = '<option>...</option>'; selectElem.disabled = true; }

        function getTableColgroup() {
            return `
                <colgroup>
                    <col style="width: 3%;">
                    <col style="width: 7%;">
                    <col style="width: 8%;">
                    <col style="width: 10%;">
                    <col style="width: 10%;">
                    <col style="width: 9%;">
                    <col style="width: 17%;">
                    <col style="width: 9%;">
                    <col style="width: 9%;">
                    <col style="width: 9%;">
                    <col style="width: 9%;">
                </colgroup>
            `;
        }

        function formatCompAndLO(text) {
            if (!text || text === 'nan') return '';
            let cleaned = String(text);
            const codeMatch = cleaned.match(/\[\s*Codes?:/i);
            if (codeMatch) cleaned = cleaned.substring(0, codeMatch.index);
            cleaned = cleaned.replace(/\|/g, '<br>').replace(/✓/g, '').replace(/👨‍🏫/g, '').replace(/🧑‍🎓/g, '').trim();
            return `<div class="pdf-text">${cleaned}</div>`;
        }

        function formatPrint(text) {
            if (!text || text === 'nan') return '';
            let cleaned = String(text).replace(/\|/g, '<br>').replace(/👨‍🏫/g, '').replace(/🧑‍🎓/g, '');
            return `<div class="pdf-text">${cleaned}</div>`;
        }

        function formatPanchapadi(text) {
            if (!text || text === 'nan') return '';
            let teacherPart = String(text).split(/🧑‍🎓?\s*ଶିକ୍ଷାର୍ଥୀଙ୍କ ପ୍ରତିକ୍ରିୟା/)[0];
            teacherPart = teacherPart.replace(/👨‍🏫?\s*ଶିକ୍ଷକଙ୍କ କାର୍ଯ୍ୟ \(TEACHER\)\s*\|?/g, '');
            let cleaned = teacherPart.replace(/\|/g, '<br>').trim();
            if (cleaned.endsWith('<br>')) cleaned = cleaned.substring(0, cleaned.length - 4).trim();
            return `<div class="pdf-text">${cleaned}</div>`;
        }

        function backToEdit() {
            document.getElementById('preview-area').classList.add('hidden');
            document.getElementById('main-container').classList.remove('hidden');
            document.getElementById('builder-area').classList.remove('hidden');
        }

        function generatePlanPreview() {
            const container = document.getElementById('pdf-preview-content');
            container.innerHTML = '';
            
            const periodBlocks = document.querySelectorAll('.period-block');
            let allRows = [];
            
            periodBlocks.forEach((block, index) => {
                const pNum = index + 1;
                const rows = block.querySelectorAll('.lesson-row');
                let isFirstInPeriod = true;
                
                rows.forEach(row => {
                    const cls = row.querySelector('.sel-class').value;
                    const subj = row.querySelector('.sel-subj').value;
                    const chap = row.querySelector('.sel-chap').value;
                    const lessKey = row.querySelector('.sel-less').value;
                    
                    if (cls && subj && chap && lessKey !== "") {
                        allRows.push({ pNum, cls, subj, chap, lessKey, isFirstInPeriod });
                        isFirstInPeriod = false; 
                    }
                });
            });

            if (allRows.length === 0) return alert("Please fully select at least one lesson plan to generate.");

            const schoolName = document.getElementById('schoolName').value || "_______________________";
            const teacherName = document.getElementById('teacherName').value || "_______________________";
            
            const rawDate = document.getElementById('planDate').value;
            let formattedDate = "____/____/20___";
            if(rawDate) {
                const parts = rawDate.split('-');
                if(parts.length === 3) formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
            }

            let tbodyHTML = '';
            allRows.forEach(rData => {
                const plan = db[rData.cls][rData.subj][rData.chap][rData.lessKey];
                const p = plan.Panchapadi || {};
                let periodDisplay = rData.isFirstInPeriod ? rData.pNum : '';

                tbodyHTML += `
                    <tr>
                        <td class="col-period">${periodDisplay}</td>
                        <td class="col-class"><b>${rData.cls.replace('_', ' ')}</b><br>${rData.subj}</td>
                        <td class="col-topic"><b>${rData.chap}</b><br><br>${plan.Topic || ''}</td>
                        <td class="col-comp">${formatCompAndLO(plan.Competency)}</td>
                        <td class="col-lo">${formatCompAndLO(plan.LearningOutcomes)}</td>
                        <td class="col-aditi">${formatPanchapadi(p.Aditi)}</td>
                        <td class="col-bodha">${formatPanchapadi(p.Bodha)}</td>
                        <td class="col-abhyasa">${formatPanchapadi(p.Abhyasa)}</td>
                        <td class="col-prayoga">${formatPanchapadi(p.Prayoga)}</td>
                        <td class="col-prasara">${formatPanchapadi(p.Prasara)}</td>
                        <td class="col-tlm">${formatPrint(plan.TLM)}</td>
                    </tr>
                `;
            });

            container.innerHTML = `
                <div class="pdf-header">
                    <h2>Daily Lesson Plan (ଦୈନିକ ପାଠ୍ୟ ଖସଡ଼ା)</h2>
                    <div class="pdf-school">School: ${schoolName}</div>
                    <div class="pdf-meta">
                        <span>Teacher Name: ${teacherName}</span>
                        <span>Date: ${formattedDate}</span>
                    </div>
                </div>
                <table class="pdf-table">
                    ${getTableColgroup()}
                    <thead>
                        <tr>
                            <th class="col-period">Prd</th>
                            <th class="col-class">Class /<br>Subj</th>
                            <th class="col-topic">Topic</th>
                            <th class="col-comp">Competency</th>
                            <th class="col-lo">Learning<br>Outcome</th>
                            <th class="col-aditi">ଅଧୀତି<br>(Adhiti)</th>
                            <th class="col-bodha">ବୋଧ<br>(Bodha)</th>
                            <th class="col-abhyasa">ଅଭ୍ୟାସ<br>(Abhyasa)</th>
                            <th class="col-prayoga">ପ୍ରୟୋଗ<br>(Prayoga)</th>
                            <th class="col-prasara">ପ୍ରସାର<br>(Prasara)</th>
                            <th class="col-tlm">TLM</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tbodyHTML}
                    </tbody>
                </table>
            `;

            document.getElementById('main-container').classList.add('hidden');
            document.getElementById('preview-area').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        // --- FLAWLESS ODIA PDF SNAPSHOT ENGINE ---
        async function sharePlanViaApp() {
            const btn = document.getElementById('btnShare');
            const ogText = btn.innerHTML;
            btn.innerHTML = '⏳ Building High-Res PDF...';
            
            const periodBlocks = document.querySelectorAll('.period-block');
            let allRows = [];
            periodBlocks.forEach((block, index) => {

                    const subj = row.querySelector('.sel-subj').value;
                    const chap = row.querySelector('.sel-chap').value;
                    const lessKey = row.querySelector('.sel-less').value;
                    if (cls && subj && chap && lessKey !== "") {
                        allRows.push({ pNum, cls, subj, chap, lessKey, isFirstInPeriod });
                        isFirstInPeriod = false; 
                    }
                });
            });

            const schoolName = document.getElementById('schoolName').value || "_______________________";
            const teacherName = document.getElementById('teacherName').value || "_______________________";
            const rawDate = document.getElementById('planDate').value;
            let formattedDate = "____/____/20___";
            if(rawDate) {
                const parts = rawDate.split('-');

            const MAX_ROWS = 4; 
            
            for (let i = 0; i < allRows.length; i += MAX_ROWS) {
                const chunk = allRows.slice(i, i + MAX_ROWS);
                let tbodyHTML = '';
                
                chunk.forEach(rData => {
                    const plan = db[rData.cls][rData.subj][rData.chap][rData.lessKey];
                    const p = plan.Panchapadi || {};
                    let periodDisplay = rData.isFirstInPeriod ? rData.pNum : '';

                    tbodyHTML += `
                        <tr>
                            <td class="col-period">${periodDisplay}</td>
                            <td class="col-class"><b>${rData.cls.replace('_', ' ')}</b><br>${rData.subj}</td>
                            <td class="col-topic"><b>${rData.chap}</b><br><br>${plan.Topic || ''}</td>
                            <td class="col-comp">${formatCompAndLO(plan.Competency)}</td>
                            <td class="col-lo">${formatCompAndLO(plan.LearningOutcomes)}</td>
                            <td class="col-aditi">${formatPanchapadi(p.Aditi)}</td>
                            <td class="col-bodha">${formatPanchapadi(p.Bodha)}</td>
                            <td class="col-abhyasa">${formatPanchapadi(p.Abhyasa)}</td>
                            <td class="col-prayoga">${formatPanchapadi(p.Prayoga)}</td>
                            <td class="col-prasara">${formatPanchapadi(p.Prasara)}</td>
                            <td class="col-tlm">${formatPrint(plan.TLM)}</td>
                        </tr>
                    `;
                });

                let headerBlock = '';
                if (i === 0) {
                    headerBlock = `
                        <div class="pdf-header">
                            <h2>Daily Lesson Plan (ଦୈନିକ ପାଠ୍ୟ ଖସଡ଼ା)</h2>
                            <div class="pdf-school">School: ${schoolName}</div>
                            <div class="pdf-meta">
                                <span>Teacher Name: ${teacherName}</span>
                                <span>Date: ${formattedDate}</span>
                            </div>
                        </div>
                    `;
                }

                container.innerHTML += `
                    <div class="pdf-page" id="export-page-${i}">
                        ${headerBlock}
                        <table class="pdf-table">
                            ${getTableColgroup()}
                            <thead>
                                <tr>
                                    <th class="col-period">Prd</th>
                                    <th class="col-class">Class /<br>Subj</th>
                                    <th class="col-topic">Topic</th>
                                    <th class="col-comp">Competency</th>
                                    <th class="col-lo">Learning<br>Outcome</th>
                                    <th class="col-aditi">ଅଧୀତି<br>(Adhiti)</th>
                                    <th class="col-bodha">ବୋଧ<br>(Bodha)</th>
                                    <th class="col-abhyasa">ଅଭ୍ୟାସ<br>(Abhyasa)</th>
                                    <th class="col-prayoga">ପ୍ରୟୋଗ<br>(Prayoga)</th>
                                    <th class="col-prasara">ପ୍ରସାର<br>(Prasara)</th>
                                    <th class="col-tlm">TLM</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tbodyHTML}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            container.style.display = 'block';
            container.style.position = 'fixed';
            container.style.top = '0';
            container.style.left = '-9999px'; 
            container.style.zIndex = '-1';

            await new Promise(resolve => setTimeout(resolve, 500));

            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('l', 'mm', 'a4');
                const pages = container.querySelectorAll('.pdf-page');

                for (let i = 0; i < pages.length; i++) {
                    const dataUrl = await htmlToImage.toPng(pages[i], {
                        pixelRatio: 2.5, 
                        backgroundColor: '#ffffff',
                        width: 1122
                    });

                    if (i > 0) pdf.addPage();
                    
                    const imgProps = pdf.getImageProperties(dataUrl);
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
                    
                    pdf.addImage(dataUrl, 'PNG', 0, 0, pdfWidth, pdfHeight);
                }

                const pdfBlob = pdf.output('blob');
                const file = new File([pdfBlob], 'Daily_Lesson_Plan.pdf', { type: 'application/pdf' });
                
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: 'Daily Lesson Plan',
                        files: [file]
                    });
                } else {
                    const url = URL.createObjectURL(pdfBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'Daily_Lesson_Plan.pdf';
                    a.click();
                    URL.revokeObjectURL(url);
                    alert("Sharing natively is not supported on this device. The PDF has been downloaded.");
                }
            } catch (err) {
                console.error(err);
                alert("Error generating PDF. Please use the Print button instead.");
            } finally {
                container.style.display = 'none'; 
                container.innerHTML = '';
                btn.innerHTML = ogText;
            }
        }
    </script>
