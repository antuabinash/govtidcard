<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lesson Plan - ଶିକ୍ଷକ ସାଥୀ</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Oriya:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        /* --- PREMIUM NATIVE UI STYLES --- */
        :root {
            --app-bg: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-main: #1C1C1E;
            --text-muted: #8E8E93;
            --primary: #0284C7; 
            --primary-hover: #0369A1;
            --radius-xl: 24px;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-app: 0 8px 24px rgba(149, 157, 165, 0.1);
            --safe-area-pt: env(safe-area-inset-top, 20px);
            --safe-area-pb: env(safe-area-inset-bottom, 20px);
            --border: #E5E5EA;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", "Noto Sans Oriya", sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--app-bg); color: var(--text-main); line-height: 1.5; min-height: 100vh; padding-bottom: calc(100px + var(--safe-area-pb)); overflow-x: hidden; }

        /* === App Header === */
        header {
            padding: calc(var(--safe-area-pt) + 16px) 24px 16px 24px;
            background: linear-gradient(135deg, #0369A1, #0284C7);
            position: sticky; top: 0; z-index: 50;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        .header-content { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
        .app-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: #FFFFFF; }

        .back-btn {
            background: transparent; border: none; color: #FFFFFF; cursor: pointer; padding: 8px; margin-left: -8px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .back-btn:active { background-color: rgba(255, 255, 255, 0.2); }

        .container { max-width: 1000px; margin: 0 auto; padding: 1.5rem; }
        
        .card { 
            background: var(--card-bg); padding: 1.5rem; 
            border-radius: var(--radius-lg); box-shadow: var(--shadow-app); 
            margin-bottom: 1.5rem; border: 1px solid rgba(0,0,0,0.03);
        }
        
        label { font-weight: 700; display: block; margin-bottom: 0.35rem; font-size: 0.8rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input[type="text"], input[type="number"], input[type="date"], select { 
            width: 100%; padding: 0.85rem 1rem; border-radius: var(--radius-md); 
            border: 1px solid #d1d5db; font-size: 1rem; font-weight: 600;
            background: #f9fafb; color: #1f2937; outline: none; transition: all 0.2s ease;
            appearance: none; -webkit-appearance: none;
        }
        input:focus, select:focus { background: #ffffff; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
        
        /* Buttons */
        .btn { 
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white; padding: 0.85rem 1.2rem; border-radius: var(--radius-md); font-weight: 700; 
            cursor: pointer; border: none; transition: all 0.2s; font-size: 1rem; 
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }
        .btn:active { transform: scale(0.96); box-shadow: 0 2px 6px rgba(2, 132, 199, 0.2); }
        
        .btn-secondary { 
            background: #E5E5EA; color: var(--text-main); padding: 0.85rem 1rem; font-size: 0.95rem; font-weight: 700;
            border-radius: var(--radius-md); border: none; box-shadow: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; transition: 0.2s;
        }
        .btn-secondary:active { background: #D1D1D6; transform: scale(0.96); }

        /* Workspace Header */
        .workspace-header {
            display: flex; flex-direction: column; gap: 1rem; background: var(--card-bg); 
            padding: 1.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-app); 
            margin-bottom: 1.5rem; border: 1px solid var(--border);
        }
        .profile-row { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; border-bottom: 1px dashed var(--border); }
        .date-row { display: flex; flex-direction: column; gap: 0.5rem;}
        
        /* Horizontal Tabs for Periods */
        .tabs-container {
            display: flex; gap: 0.75rem; overflow-x: auto; padding-bottom: 0.5rem; margin-bottom: 1rem;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab-btn {
            padding: 0.6rem 1.2rem; background: #F2F2F7; border: 1px solid var(--border);
            border-radius: 100px; font-weight: 700; font-size: 0.9rem; color: var(--text-muted);
            cursor: pointer; white-space: nowrap; transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--primary); color: white; border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
        }

        /* Period Form Container */
        .period-pane { display: none; animation: fadeIn 0.3s ease; }
        .period-pane.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .form-grid { display: grid; grid-template-columns: 1fr; gap: 1.25rem; }

        .setup-grid { display: grid; grid-template-columns: 1fr; gap: 1.25rem; margin-bottom: 1.5rem; }

        /* FIXED BOTTOM ACTION BAR */
        .fixed-action-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
            padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom, 0px));
            z-index: 1000; box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
        }
        .fixed-action-bar .btn-secondary { width: 45px; height: 45px; padding: 0; flex-shrink: 0; border-radius: 50%; } /* Circle prev/next btns */
        .fixed-action-bar .btn-generate { flex: 1; height: 45px; }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px);
            z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 1rem;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content { background: white; padding: 1.5rem; border-radius: var(--radius-lg); width: 100%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); transform: translateY(20px); transition: 0.3s; }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
        .close-modal { background: #E5E5EA; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: var(--text-main); font-weight: bold; }

        .hidden { display: none !important; }

        /* --- PREVIEW AND PRINT STYLES --- */
        #preview-wrapper { background: white; padding: 1rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-app); overflow-x: auto; margin-bottom: 1.5rem; border: 1px solid var(--border); }
        #pdf-preview-content { min-width: 1000px; background: white; color: black; font-family: 'Plus Jakarta Sans', 'Noto Sans Oriya', sans-serif; }
        
        /* The Hidden Export container logic changed for better mobile memory support */
        #temp-pdf-export { 
            position: absolute; top: 0; left: 0; z-index: -100; opacity: 0; pointer-events: none; 
            width: 1122px; background: white; color: black; font-family: 'Plus Jakarta Sans', 'Noto Sans Oriya', sans-serif; 
        }
        
        .pdf-text { font-family: 'Plus Jakarta Sans', 'Noto Sans Oriya', sans-serif; margin-bottom: 3px; }
        .pdf-header { text-align: center; margin-bottom: 12px; width: 100%; }
        .pdf-header h2 { margin: 0 0 4px 0; font-size: 18px; text-transform: uppercase; color: #000; font-weight: 800; }
        .pdf-school { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #374151; }
        .pdf-meta { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; margin-bottom: 4px; border-bottom: 2px solid #000; padding-bottom: 4px; color: #000; }
        
        .pdf-table { width: 100%; border-collapse: collapse; font-size: 9.5px; table-layout: fixed; color: #000; margin-bottom: 10px; }
        .pdf-table thead { display: table-header-group; } 
        .pdf-table tbody tr { page-break-inside: avoid !important; break-inside: avoid !important; } 
        .pdf-table th, .pdf-table td { border: 1px solid #000; padding: 5px; vertical-align: top; line-height: 1.3; word-wrap: break-word; word-break: normal; overflow-wrap: break-word; }
        .pdf-table th { background-color: #f8fafc !important; font-weight: bold; text-align: left; }
        th.print-header-cell { background-color: white !important; border: none !important; padding: 0 0 10px 0 !important; }
        .col-period { text-align: center; font-weight: bold; }
        .pdf-text b { font-size: 9px; }

        .html2pdf__page-break { height: 0; width: 100%; page-break-before: always; border: none; margin: 0; padding: 0; }
        .pdf-page { width: 1122px; padding: 20px; background: white; box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Noto Sans Oriya', sans-serif; }

        @media print {
            .no-print, .container:not(#preview-area), .modal-overlay, #temp-pdf-export, .fixed-action-bar { display: none !important; }
            #preview-wrapper { padding: 0; box-shadow: none; border: none; margin: 0; overflow: visible; }
            #pdf-preview-content { min-width: 100%; width: 100% !important; display: block !important; }
            @page { size: A4 landscape; margin: 6mm; }
            body { background: white; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <!-- UI HEADER -->
    <header class="no-print">
        <div class="header-content">
            <button class="back-btn" aria-label="Back" onclick="window.history.back();">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <h1 class="app-title">Daily Lesson Plan</h1>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <div class="container no-print" id="main-container">

        <!-- Setup Card (First Time Only) -->
        <div id="setup-card" class="card">
            <h2 style="margin-bottom: 1.25rem; font-weight: 800; color: var(--primary);">Setup Profile</h2>
            <div class="setup-grid">
                <div><label>School Name</label><input type="text" id="schoolName" placeholder="e.g. Govt. High School..."></div>
                <div><label>Teacher Name</label><input type="text" id="teacherName" placeholder="e.g. Abinash Mahapatra..."></div>
                <div><label>Total Periods</label><input type="number" id="numPeriods" min="1" max="10" value="7"></div>
            </div>
            <button class="btn" style="width: 100%; margin-top: 0.5rem;" onclick="initializeWorkspace()">Continue to Workspace</button>
        </div>

        <!-- Builder Area -->
        <div id="builder-area" class="hidden">
            <!-- Workspace Header (Profile + Date) -->
            <div class="workspace-header">
                <div class="profile-row">
                    <div>
                        <div id="display-school" style="font-weight: 800; font-size: 1.1rem; color: var(--primary);">School Name</div>
                        <div id="display-teacher" style="font-size: 0.9rem; color: var(--text-muted); font-weight: 600;">Teacher Name</div>
                    </div>
                    <button class="btn-secondary" onclick="openProfileModal()" style="padding: 0.5rem 0.8rem; font-size: 0.8rem;">⚙️ Edit</button>
                </div>
                <div class="date-row">
                    <label>Lesson Plan Date</label>
                    <input type="date" id="planDate" onchange="savePlanToStorage()">
                </div>
            </div>

            <!-- Tabbed Period Navigation -->
            <div class="tabs-container" id="periodTabs"></div>

            <!-- Forms Container -->
            <div class="card" style="padding: 1.25rem;">
                <div id="periods-container"></div>
            </div>
        </div>
    </div>

    <!-- BUILDER FOOTER -->
    <div class="fixed-action-bar no-print hidden" id="builder-footer">
        <button class="btn-secondary" onclick="prevPeriod()" id="btnPrev">⬅️</button>
        <button class="btn btn-generate" onclick="generatePlanPreview()">✨ Generate Plan</button>
        <button class="btn-secondary" onclick="nextPeriod()" id="btnNext">➡️</button>
    </div>

    <!-- PREVIEW & ACTION AREA -->
    <div class="container hidden" id="preview-area">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;" class="no-print">
            <h2 style="font-size: 1.4rem; font-weight: 800;">📄 Print Preview</h2>
        </div>

        <div id="preview-wrapper">
            <div id="pdf-preview-content"></div>
        </div>
    </div>

    <!-- PREVIEW FOOTER -->
    <div class="fixed-action-bar no-print hidden" id="preview-footer">
        <button class="btn-secondary" onclick="backToEdit()" style="flex: 1; border-radius: var(--radius-md);">✏️ Edit</button>
        <button class="btn" style="background: #10B981; color: white; flex: 1; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);" onclick="window.print()">🖨️ Print</button>
        <button id="btnShare" class="btn" onclick="sharePlanViaApp()" style="flex: 1;">📤 Share</button>
    </div>

    <!-- HIDDEN EXPORT CONTAINER -->
    <div id="temp-pdf-export"></div>

    <!-- PROFILE MODAL -->
    <div id="edit-profile-modal" class="modal-overlay no-print">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Profile Settings</h2>
                <button class="close-modal" onclick="closeProfileModal()">✕</button>
            </div>
            <div class="setup-grid" style="margin-bottom: 1.5rem;">
                <div><label>School Name</label><input type="text" id="modalSchoolName"></div>
                <div><label>Teacher Name</label><input type="text" id="modalTeacherName"></div>
                <div><label>Total Periods</label><input type="number" id="modalNumPeriods" min="1" max="10"></div>
            </div>
            <button class="btn" style="width: 100%;" onclick="saveUpdatedProfile()">Save Settings</button>
        </div>
    </div>

    <script>
        let db = {};
        let classList = [];
        let isDbLoaded = false;
        let currentPeriodIndex = 1;
        let totalPeriods = 1;

        // --- ASYNC DATABASE LOADING ---
        document.addEventListener("DOMContentLoaded", () => {
            fetch('master_lesson_database.json')
                .then(response => response.json())
                .then(data => {
                    db = data;
                    classList = Object.keys(db).sort();
                    isDbLoaded = true;
                    // If workspace is active, hydrate dropdowns
                    if (!document.getElementById('builder-area').classList.contains('hidden')) {
                        hydrateAllDropdowns();
                    }
                })
                .catch(err => {
                    console.error("DB Load Error", err);
                });

            // Init State
            if (!loadPlanFromStorage()) {
                document.getElementById('planDate').valueAsDate = new Date();
                document.getElementById('setup-card').classList.remove('hidden');
            }
        });

        // --- CORE STATE MANAGEMENT ---
        function initializeWorkspace() {
            const sName = document.getElementById('schoolName').value;
            const tName = document.getElementById('teacherName').value;
            const nPeriods = parseInt(document.getElementById('numPeriods').value) || 7;

            if(!sName || !tName) return alert("Please enter your Name and School.");

            totalPeriods = nPeriods;
            
            document.getElementById('setup-card').classList.add('hidden');
            document.getElementById('builder-area').classList.remove('hidden');
            document.getElementById('builder-footer').classList.remove('hidden');
            
            updateUIHeader();
            buildTabsAndForms();
            savePlanToStorage();
        }

        function savePlanToStorage() {
            let validPeriods = [];
            document.querySelectorAll('.period-pane').forEach(pane => {
                validPeriods.push([{
                    cls: pane.querySelector('.sel-class').value,
                    subj: pane.querySelector('.sel-subj').value,
                    chap: pane.querySelector('.sel-chap').value,
                    lessKey: pane.querySelector('.sel-less').value
                }]);
            });

            localStorage.setItem('lessonGuruAutoSave', JSON.stringify({
                schoolName: document.getElementById('schoolName').value,
                teacherName: document.getElementById('teacherName').value,
                planDate: document.getElementById('planDate').value,
                numPeriods: totalPeriods,
                periods: validPeriods
            }));
        }

        function loadPlanFromStorage() {
            const saved = localStorage.getItem('lessonGuruAutoSave');
            if (!saved) return false;
            try {
                let data = JSON.parse(saved);
                
                document.getElementById('schoolName').value = data.schoolName || "";
                document.getElementById('teacherName').value = data.teacherName || "";
                
                // Fallback to today if date is missing
                if (data.planDate) {
                    document.getElementById('planDate').value = data.planDate;
                } else {
                    document.getElementById('planDate').valueAsDate = new Date();
                }
                
                totalPeriods = parseInt(data.numPeriods) || 7;
                document.getElementById('numPeriods').value = totalPeriods;

                updateUIHeader(); 

                document.getElementById('setup-card').classList.add('hidden');
                document.getElementById('builder-area').classList.remove('hidden');
                document.getElementById('builder-footer').classList.remove('hidden');

                buildTabsAndForms(data.periods);
                
                return true;
            } catch(e) { return false; }
        }

        function updateUIHeader() {
            document.getElementById('display-school').innerText = document.getElementById('schoolName').value || "No School";
            document.getElementById('display-teacher').innerText = document.getElementById('teacherName').value || "No Name";
        }

        // --- PAGINATED UI LOGIC ---
        function buildTabsAndForms(savedPeriodsData = null) {
            const tabsContainer = document.getElementById('periodTabs');
            const formsContainer = document.getElementById('periods-container');
            tabsContainer.innerHTML = '';
            formsContainer.innerHTML = '';

            for (let i = 1; i <= totalPeriods; i++) {
                // Build Tab
                const tab = document.createElement('button');
                tab.className = `tab-btn ${i === 1 ? 'active' : ''}`;
                tab.id = `tab-${i}`;
                tab.innerText = `Period ${i}`;
                tab.onclick = () => switchPeriod(i);
                tabsContainer.appendChild(tab);

                // Build Form Pane
                const pane = document.createElement('div');
                pane.className = `period-pane ${i === 1 ? 'active' : ''}`;
                pane.id = `pane-${i}`;
                const rowId = `row-${i}`;
                
                pane.innerHTML = `
                    <h3 style="margin-bottom: 1rem; color: var(--primary);">Configure Period ${i}</h3>
                    <div class="form-grid">
                        <div><label>Class</label><select class="sel-class" onchange="updateSubjects('${rowId}'); savePlanToStorage();"><option value="">Select Class...</option></select></div>
                        <div><label>Subject</label><select class="sel-subj" onchange="updateChapters('${rowId}'); savePlanToStorage();" disabled><option>...</option></select></div>
                        <div><label>Chapter</label><select class="sel-chap" onchange="updateLessons('${rowId}'); savePlanToStorage();" disabled><option>...</option></select></div>
                        <div><label>Lesson</label><select class="sel-less" onchange="savePlanToStorage();" disabled><option>...</option></select></div>
                    </div>
                `;
                formsContainer.appendChild(pane);

                // Restore Data if available
                if (savedPeriodsData && savedPeriodsData[i-1] && savedPeriodsData[i-1][0]) {
                    const preset = savedPeriodsData[i-1][0];
                    pane.dataset.presetCls = preset.cls;
                    pane.dataset.presetSubj = preset.subj;
                    pane.dataset.presetChap = preset.chap;
                    pane.dataset.presetLess = preset.lessKey;
                }
            }

            currentPeriodIndex = 1;
            updateFooterButtons();
            
            if(isDbLoaded) hydrateAllDropdowns();
        }

        function switchPeriod(index) {
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.period-pane').forEach(p => p.classList.remove('active'));
            
            document.getElementById(`tab-${index}`).classList.add('active');
            document.getElementById(`pane-${index}`).classList.add('active');
            
            // Scroll tabs into view
            document.getElementById(`tab-${index}`).scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            
            currentPeriodIndex = index;
            updateFooterButtons();
        }

        function prevPeriod() { if (currentPeriodIndex > 1) switchPeriod(currentPeriodIndex - 1); }
        function nextPeriod() { if (currentPeriodIndex < totalPeriods) switchPeriod(currentPeriodIndex + 1); }

        function updateFooterButtons() {
            document.getElementById('btnPrev').style.visibility = currentPeriodIndex === 1 ? 'hidden' : 'visible';
            document.getElementById('btnNext').style.visibility = currentPeriodIndex === totalPeriods ? 'hidden' : 'visible';
        }

        // --- DROPDOWN LOGIC ---
        function hydrateAllDropdowns() {
            const classOptions = `<option value="">Select Class...</option>` + classList.map(c => `<option value="${c}">${c.replace('_', ' ')}</option>`).join('');
            
            for (let i = 1; i <= totalPeriods; i++) {
                const pane = document.getElementById(`pane-${i}`);
                const clsSel = pane.querySelector('.sel-class');
                clsSel.innerHTML = classOptions;

                // Apply presets if they exist
                if (pane.dataset.presetCls) {
                    clsSel.value = pane.dataset.presetCls;
                    updateSubjects(`row-${i}`);
                    if (pane.dataset.presetSubj) {
                        pane.querySelector('.sel-subj').value = pane.dataset.presetSubj;
                        updateChapters(`row-${i}`);
                        if (pane.dataset.presetChap) {
                            pane.querySelector('.sel-chap').value = pane.dataset.presetChap;
                            updateLessons(`row-${i}`);
                            if (pane.dataset.presetLess) {
                                pane.querySelector('.sel-less').value = pane.dataset.presetLess;
                            }
                        }
                    }
                }
            }
        }

        function updateSubjects(rowId) {
            const pane = document.getElementById(rowId.replace('row-', 'pane-'));
            const cls = pane.querySelector('.sel-class').value;
            resetSelect(pane.querySelector('.sel-chap')); resetSelect(pane.querySelector('.sel-less'));
            if (!cls) return resetSelect(pane.querySelector('.sel-subj'));
            populateSelect(pane.querySelector('.sel-subj'), Object.keys(db[cls] || {}), "Select Subject...");
        }

        function updateChapters(rowId) {
            const pane = document.getElementById(rowId.replace('row-', 'pane-'));
            const cls = pane.querySelector('.sel-class').value;
            const subj = pane.querySelector('.sel-subj').value;
            resetSelect(pane.querySelector('.sel-less'));
            if (!subj) return resetSelect(pane.querySelector('.sel-chap'));
            populateSelect(pane.querySelector('.sel-chap'), Object.keys(db[cls][subj] || {}), "Select Chapter...");
        }

        function updateLessons(rowId) {
            const pane = document.getElementById(rowId.replace('row-', 'pane-'));
            const cls = pane.querySelector('.sel-class').value;
            const subj = pane.querySelector('.sel-subj').value;
            const chap = pane.querySelector('.sel-chap').value;
            const lessSel = pane.querySelector('.sel-less');
            if (!chap) return resetSelect(lessSel);
            
            const lessonsData = db[cls][subj][chap] || {};
            const lessons = Array.isArray(lessonsData) ? lessonsData.map((l, i) => i) : Object.keys(lessonsData);
            
            lessSel.innerHTML = '<option value="">Select Lesson...</option>';
            lessons.forEach(key => {
                const name = Array.isArray(lessonsData) ? lessonsData[key].Period : key;
                const opt = document.createElement('option'); opt.value = key; opt.textContent = name;
                lessSel.appendChild(opt);
            });
            lessSel.disabled = false;
        }

        function populateSelect(selectElem, items, placeholder) {
            selectElem.innerHTML = `<option value="">${placeholder}</option>`;
            items.forEach(item => { const opt = document.createElement('option'); opt.value = item; opt.textContent = item; selectElem.appendChild(opt); });
            selectElem.disabled = false;

        function resetSelect(selectElem) { selectElem.innerHTML = '<option>...</option>'; selectElem.disabled = true; }

        // --- PDF GENERATION UTILS ---
        function getTableColgroup() {
            return `<colgroup><col style="width: 3%;"><col style="width: 7%;"><col style="width: 8%;"><col style="width: 10%;"><col style="width: 10%;"><col style="width: 9%;"><col style="width: 17%;"><col style="width: 9%;"><col style="width: 9%;"><col style="width: 9%;"><col style="width: 9%;"></colgroup>`;
        }

        function formatCompAndLO(text) {
            if (!text || text === 'nan') return '';
            let cleaned = String(text);
            const codeMatch = cleaned.match(/\[\s*Codes?:/i);
            if (codeMatch) cleaned = cleaned.substring(0, codeMatch.index);
            cleaned = cleaned.replace(/\|/g, '<br>').replace(/✓/g, '').replace(/👨‍🏫/g, '').replace(/🧑‍🎓/g, '').trim();
            return `<div class="pdf-text">${cleaned}</div>`;
        }

        function formatPrint(text) {
            if (!text || text === 'nan') return '';
            let cleaned = String(text).replace(/\|/g, '<br>').replace(/👨‍🏫/g, '').replace(/🧑‍🎓/g, '');
            return `<div class="pdf-text">${cleaned}</div>`;
        }

        function formatPanchapadi(text) {
            if (!text || text === 'nan') return '';
            let teacherPart = String(text).split(/🧑‍🎓?\s*ଶିକ୍ଷାର୍ଥୀଙ୍କ ପ୍ରତିକ୍ରିୟା/)[0];
            teacherPart = teacherPart.replace(/👨‍🏫?\s*ଶିକ୍ଷକଙ୍କ କାର୍ଯ୍ୟ \(TEACHER\)\s*\|?/g, '');
            let cleaned = teacherPart.replace(/\|/g, '<br>').trim();
            if (cleaned.endsWith('<br>')) cleaned = cleaned.substring(0, cleaned.length - 4).trim();
            return `<div class="pdf-text">${cleaned}</div>`;
        }

                            <th class="col-abhyasa">ଅଭ୍ୟାସ<br>(Abhyasa)</th>

        // --- FLAWLESS ODIA PDF SNAPSHOT ENGINE ---
        async function sharePlanViaApp() {
            const btn = document.getElementById('btnShare');
            const ogText = btn.innerHTML;
            btn.innerHTML = '⏳ Processing...';
            
            let allRows = [];
            for(let i=1; i<=totalPeriods; i++) {
                const pane = document.getElementById(`pane-${i}`);
                const cls = pane.querySelector('.sel-class').value;
                const subj = pane.querySelector('.sel-subj').value;
                const chap = pane.querySelector('.sel-chap').value;
                const lessKey = pane.querySelector('.sel-less').value;
                if (cls && subj && chap && lessKey !== "") {
                    allRows.push({ pNum: i, cls, subj, chap, lessKey });
                }
            }

            const schoolName = document.getElementById('schoolName').value || "_______________________";
            const teacherName = document.getElementById('teacherName').value || "Teacher";
            const rawDate = document.getElementById('planDate').value;
            let formattedDate = "____/____/20___";
            if(rawDate) {
                const parts = rawDate.split('-');
                if(parts.length === 3) formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
            }

            const container = document.getElementById('temp-pdf-export');
            container.innerHTML = '';
            
            const MAX_ROWS = 4; 
            for (let i = 0; i < allRows.length; i += MAX_ROWS) {
                const chunk = allRows.slice(i, i + MAX_ROWS);
                let tbodyHTML = '';
                
                chunk.forEach(rData => {
                    const plan = db[rData.cls][rData.subj][rData.chap][rData.lessKey];
                    const p = plan.Panchapadi || {};
                    tbodyHTML += `
                        <tr>
                            <td class="col-period">${rData.pNum}</td>
                            <td class="col-class"><b>${rData.cls.replace('_', ' ')}</b><br>${rData.subj}</td>
                            <td class="col-topic"><b>${rData.chap}</b><br><br>${plan.Topic || ''}</td>
                            <td class="col-comp">${formatCompAndLO(plan.Competency)}</td>
                            <td class="col-lo">${formatCompAndLO(plan.LearningOutcomes)}</td>
                            <td class="col-aditi">${formatPanchapadi(p.Aditi)}</td>
                            <td class="col-bodha">${formatPanchapadi(p.Bodha)}</td>
                            <td class="col-abhyasa">${formatPanchapadi(p.Abhyasa)}</td>
                            <td class="col-prayoga">${formatPanchapadi(p.Prayoga)}</td>
                            <td class="col-prasara">${formatPanchapadi(p.Prasara)}</td>
                            <td class="col-tlm">${formatPrint(plan.TLM)}</td>
                        </tr>
                    `;
                });

                let headerBlock = '';
                if (i === 0) {
                    headerBlock = `
                        <div class="pdf-header">
                            <h2>Daily Lesson Plan (ଦୈନିକ ପାଠ୍ୟ ଖସଡ଼ା)</h2>
                            <div class="pdf-school">School: ${schoolName}</div>
                            <div class="pdf-meta">
                                <span>Teacher Name: ${teacherName}</span>
                                <span>Date: ${formattedDate}</span>
                            </div>
                        </div>
                    `;
                }

                container.innerHTML += `
                    <div class="pdf-page" id="export-page-${i}">
                        ${headerBlock}
                        <table class="pdf-table">
                            ${getTableColgroup()}
                            <thead>
                                <tr>
                                    <th class="col-period">Prd</th>
                                    <th class="col-class">Class /<br>Subj</th>
                                    <th class="col-topic">Topic</th>
                                    <th class="col-comp">Competency</th>
                                    <th class="col-lo">Learning<br>Outcome</th>
                                    <th class="col-aditi">ଅଧୀତି<br>(Adhiti)</th>
                                    <th class="col-bodha">ବୋଧ<br>(Bodha)</th>
                                    <th class="col-abhyasa">ଅଭ୍ୟାସ<br>(Abhyasa)</th>
                                    <th class="col-prayoga">ପ୍ରୟୋଗ<br>(Prayoga)</th>
                                    <th class="col-prasara">ପ୍ରସାର<br>(Prasara)</th>
                                    <th class="col-tlm">TLM</th>
                                </tr>
                            </thead>
                            <tbody>${tbodyHTML}</tbody>
                        </table>
                    </div>
                `;
            }

            // Fixed error rendering bug by using absolute position on screen instead of left:-9999px
            container.style.opacity = '1';

            await new Promise(resolve => setTimeout(resolve, 500));

            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('l', 'mm', 'a4');
                const pages = container.querySelectorAll('.pdf-page');

                for (let i = 0; i < pages.length; i++) {
                    // Lowered pixelRatio from 2.5 to 2.0 to prevent mobile memory crash
                    const dataUrl = await htmlToImage.toPng(pages[i], {
                        pixelRatio: 2.0, 
                        backgroundColor: '#ffffff',
                        width: 1122
                    });

                    if (i > 0) pdf.addPage();
                    const imgProps = pdf.getImageProperties(dataUrl);
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
                    pdf.addImage(dataUrl, 'PNG', 0, 0, pdfWidth, pdfHeight);
                }

                const pdfBlob = pdf.output('blob');
                const safeTeacherName = teacherName.replace(/[^a-zA-Z0-9]/g, '_');
                const safeDate = formattedDate.replace(/\//g, '-');
                const customFileName = `${safeTeacherName}_LessonPlan_${safeDate}.pdf`;
                
                const file = new File([pdfBlob], customFileName, { type: 'application/pdf' });
                
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ title: 'Daily Lesson Plan', files: [file] });
                } else {
                    const url = URL.createObjectURL(pdfBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = customFileName;
                    a.click();
                    URL.revokeObjectURL(url);
                    alert("Sharing natively is not supported. File Downloaded.");
                }
            } catch (err) {
                console.error(err);
                alert("Error generating PDF. Please use the Print option instead.");
            } finally {
                container.style.opacity = '0'; 
                container.innerHTML = '';
                btn.innerHTML = ogText;
            }
        }
    </script>
