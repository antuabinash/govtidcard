        // Populate Subject Dropdown dynamically
        const subjects = [...new Set(lessonData.map(item => item.Subject).filter(s => s !== "Uncategorized"))].sort();
        const subjectSelect = document.getElementById('subject-filter');
        subjects.forEach(subject => {
            const option = document.createElement('option');
            option.value = subject;
            option.textContent = subject;
            subjectSelect.appendChild(option);
        });

        function renderData() {
            const classFilter = document.getElementById('class-filter').value;
            const subjectFilter = document.getElementById('subject-filter').value;
            const container = document.getElementById('lo-container');
            const counter = document.getElementById('lo-counter');
            
            container.innerHTML = "";
            
            const filteredData = lessonData.filter(item => {
                const classMatch = (classFilter === "All" || item.Class === classFilter);
                const subjectMatch = (subjectFilter === "All" || item.Subject === subjectFilter);
                return classMatch && subjectMatch;
            });

            counter.textContent = filteredData.length;

            if (filteredData.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-10">No Learning Outcomes found for this selection.</div>`;
                return;
            }

            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = "lo-card bg-white p-6 rounded-lg shadow-sm border border-gray-200 border-l-4 border-l-blue-500";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4 border-b pb-4">
                        <span class="inline-block bg-blue-100 text-blue-800 text-xs px-3 py-1 rounded-full font-semibold uppercase">${item.Subject}</span>
                        <span class="inline-block bg-green-100 text-green-800 text-xs px-3 py-1 rounded-full font-semibold uppercase">${item.Class || "Class N/A"}</span>
                    </div>
                    
                    <div class="mb-4">
                        <h3 class="text-xs font-bold text-gray-400 uppercase mb-1">Curriculum Goal (CG)</h3>
                        <p class="text-sm text-gray-800 bg-gray-50 p-3 rounded">${item.Curriculum_Goal || "N/A"}</p>
                    </div>
                    
                    <div class="mb-4">
                        <h3 class="text-xs font-bold text-gray-400 uppercase mb-1">Competency (C)</h3>
                        <p class="text-sm text-gray-800 bg-gray-50 p-3 rounded">${item.Competency || "N/A"}</p>
                    </div>
                    
                    <div>
                        <h3 class="text-xs font-bold text-gray-400 uppercase mb-1">Learning Outcome (LO)</h3>
                        <p class="text-base font-medium text-gray-900">${item.Learning_Outcome}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('class-filter').addEventListener('change', renderData);
        document.getElementById('subject-filter').addEventListener('change', renderData);
