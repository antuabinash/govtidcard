<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <title>Panchapadi Summary Database | Sikhyak Sathi</title>
    <meta name="description" content="Odisha Lesson Plan and Chapter Summaries from the Panchapadi Database.">
    <meta name="theme-color" content="#F4F6F9">

    <style>
        :root {
            --app-bg: #F4F6F9;
            --card-bg: #FFFFFF;
            --text-main: #1D1D1F;
            --text-muted: #86868B;
            --primary: #007AFF;
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.04);
            --safe-area-pt: env(safe-area-inset-top, 16px);
            --safe-area-pb: env(safe-area-inset-bottom, 20px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--app-bg); color: var(--text-main); line-height: 1.5; padding-bottom: calc(80px + var(--safe-area-pb)); overflow-x: hidden; }

        header { padding: calc(var(--safe-area-pt) + 12px) 24px 12px 24px; background: rgba(244, 246, 249, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(0,0,0,0.03); display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .profile-pic { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px; box-shadow: 0 4px 10px rgba(161, 140, 209, 0.3); }
        .app-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-main); }
        .app-title-sub { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-left: 4px; }
        
        .container { max-width: 1000px; margin: 0 auto; padding: 16px 24px; }
        
        /* Database Rendering Styles */
        .platform-title { font-size: 28px; font-weight: 800; text-align: center; margin-bottom: 24px; color: var(--text-main); }
        
        .class-section { margin-bottom: 40px; }
        .class-title { font-size: 22px; font-weight: 800; color: var(--primary); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid rgba(0, 122, 255, 0.2); display: flex; align-items: center; gap: 8px; }
        
        .subject-section { margin-bottom: 24px; padding-left: 12px; border-left: 3px solid #E5E5EA; }
        .subject-title { font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        
        .chapter-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        
        .chapter-card { background: var(--card-bg); border-radius: var(--radius-xl); padding: 24px; box-shadow: var(--shadow-soft); border: 1px solid rgba(0,0,0,0.04); transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .chapter-card:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08); }
        
        .chapter-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px dashed #E5E5EA; padding-bottom: 12px; }
        .chapter-title { font-size: 16px; font-weight: 800; color: var(--text-main); text-transform: capitalize; }
        .chapter-badge { background: linear-gradient(135deg, #667EEA, #764BA2); color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; }
        
        .chapter-summary p { font-size: 14px; color: var(--text-muted); line-height: 1.7; margin-bottom: 12px; text-align: justify; }
        .chapter-summary p:last-child { margin-bottom: 0; }
        .citation { font-size: 11px; color: var(--primary); font-weight: 600; margin-left: 4px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: calc(70px + var(--safe-area-pb)); background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-top: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px; padding-bottom: var(--safe-area-pb); z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); text-decoration: none; gap: 6px; flex: 1; transition: color 0.2s, transform 0.2s; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-item svg { width: 24px; height: 24px; stroke-width: 2; }
        .nav-item span { font-size: 11px; font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="profile-pic">📚</div>
            <div>
                <h1 class="app-title">ଶିକ୍ଷକ ସାଥୀ <span class="app-title-sub">Summary DB</span></h1>
            </div>
        </div>
    </header>

    <main class="container" id="database-container">
        <!-- Content will be injected here via JavaScript -->
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span>Home</span></a>
        <a class="nav-item active"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg><span>Database</span></a>
    </nav>

    <script>
        // Data loading function assuming the panchapadi_summary_database.json is located in the same directory.
        // For standalone demonstration, the provided JSON logic is integrated into the fetch callback structure.
        async function loadDatabase() {
            const container = document.getElementById('database-container');
            
            try {
                // Fetch the JSON file verbatim as requested: "panchapadi_summary_database.json"
                const response = await fetch('panchapadi_summary_database.json');
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                const data = await response.json();
                renderDatabase(data, container);
                
            } catch (error) {
                // Fallback: If fetch fails (e.g., due to CORS running locally without a server), 
                // prompt the user to ensure the JSON file is hosted correctly.
                container.innerHTML = `
                    <div class="chapter-card" style="text-align: center; color: var(--text-main);">
                        <div style="font-size: 40px; margin-bottom: 16px;">⚠️</div>
                        <h3>Unable to load database</h3>
                        <p style="text-align: center;">Please ensure <strong>panchapadi_summary_database.json</strong> is placed in the same directory and you are running this file through a local web server.</p>
                    </div>
                `;
                console.error("Error loading JSON:", error);
            }
        }

        function renderDatabase(data, container) {
            let html = `<h2 class="platform-title">Platform: ${data.platform} <span class="citation">[cite: 1]</span></h2>`;
            
            data.classes.forEach(cls => {
                html += `
                <div class="class-section">
                    <h2 class="class-title">🎓 ${cls.class_name} <span class="citation">[cite: 1]</span></h2>
                `;
                
                cls.subjects.forEach(subject => {
                    html += `
                    <div class="subject-section">
                        <h3 class="subject-title">📖 ${subject.subject_name} <span class="citation">[cite: 1]</span></h3>
                        <div class="chapter-grid">
                    `;
                    
                    subject.chapters.forEach(chapter => {
                        let summaryHtml = '';
                        chapter.content_data.summary.forEach(paragraph => {
                            summaryHtml += `<p>${paragraph} <span class="citation">[cite: 1]</span></p>`;
                        });
                        
                        html += `
                            <div class="chapter-card">
                                <div class="chapter-header">
                                    <div class="chapter-title">${chapter.chapter_id.replace('-', ' ')} <span class="citation">[cite: 1]</span></div>
                                    <div class="chapter-badge">Summary</div>
                                </div>
                                <div class="chapter-summary">
                                    ${summaryHtml}
                                </div>
                            </div>
                        `;
                    });
                    
                    html += `
                        </div>
                    </div>
                    `;
                });
                
                html += `</div>`;
            });
            
            container.innerHTML = html;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadDatabase);
    </script>
</body>
</html>
