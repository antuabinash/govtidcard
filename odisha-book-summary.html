<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <title>Panchapadi Database | Sikhyak Sathi</title>
    <meta name="description" content="Odisha Lesson Plan and Chapter Summaries from the Panchapadi Database.">
    <meta name="theme-color" content="#F4F6F9">

    <style>
        :root {
            --app-bg: #F4F6F9;
            --card-bg: #FFFFFF;
            --text-main: #1D1D1F;
            --text-muted: #86868B;
            --primary: #007AFF;
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.04);
            --safe-area-pt: env(safe-area-inset-top, 16px);
            --safe-area-pb: env(safe-area-inset-bottom, 20px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--app-bg); color: var(--text-main); line-height: 1.5; padding-bottom: calc(40px + var(--safe-area-pb)); overflow-x: hidden; }

        header { padding: calc(var(--safe-area-pt) + 12px) 24px 12px 24px; background: rgba(244, 246, 249, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(0,0,0,0.03); display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .profile-pic { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px; box-shadow: 0 4px 10px rgba(161, 140, 209, 0.3); }
        .app-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-main); }
        .app-title-sub { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-left: 4px; }
        
        .container { max-width: 1000px; margin: 0 auto; padding: 16px 24px; }
        .section-title { font-size: 20px; font-weight: 800; margin-bottom: 16px; color: var(--text-main); }
        
        .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
        @media (min-width: 768px) { .app-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px; } }
        
        .app-card { background: var(--card-bg); border-radius: var(--radius-xl); padding: 20px 16px; text-decoration: none; display: flex; flex-direction: column; position: relative; box-shadow: var(--shadow-soft); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease; border: 1px solid rgba(255,255,255,0.8); height: 100%; cursor: pointer; }
        .app-card:active { transform: scale(0.94); box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .app-card h3 { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 6px; text-transform: capitalize; }
        .app-card p { font-size: 13px; color: var(--text-muted); display: block; margin-top: 4px; }
        
        .icon-box { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; margin-bottom: 16px; box-shadow: 0 8px 16px rgba(0,0,0,0.08); }
        .grad-blue { background: linear-gradient(135deg, #4FACFE 0%, #00F2FE 100%); }
        .grad-purple { background: linear-gradient(135deg, #B1B0FC 0%, #E0C3FC 100%); }
        .grad-green { background: linear-gradient(135deg, #0BA360 0%, #3CBA92 100%); }
        
        .chapter-card { background: var(--card-bg); border-radius: var(--radius-xl); padding: 24px; box-shadow: var(--shadow-soft); border: 1px solid rgba(0,0,0,0.04); }
        .chapter-header { display: flex; justify-content: space-between; align-items: flex-start; flex-direction: column; gap: 8px; margin-bottom: 16px; border-bottom: 1px dashed #E5E5EA; padding-bottom: 12px; }
        .chapter-header-top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .chapter-title { font-size: 18px; font-weight: 800; color: var(--text-main); }
        .chapter-subtitle { font-size: 14px; font-weight: 600; color: var(--text-muted); text-transform: capitalize; }
        .chapter-badge { background: linear-gradient(135deg, #667EEA, #764BA2); color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; }
        .chapter-summary p { font-size: 15px; color: var(--text-main); line-height: 1.7; margin-bottom: 16px; text-align: justify; }
        .chapter-summary p:last-child { margin-bottom: 0; }
        
        .btn-secondary { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 12px; background: #E5E5EA; color: var(--text-main); font-weight: 700; border: none; font-size: 14px; cursor: pointer; margin-bottom: 24px; transition: background 0.2s; }
        .btn-secondary:hover { background: #D1D1D6; }
        .btn-secondary:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="profile-pic">📚</div>
            <div>
                <h1 class="app-title">ଶିକ୍ଷକ ସାଥୀ <span class="app-title-sub">Summary DB</span></h1>
            </div>
        </div>
    </header>

    <main class="container" id="database-container">
        <p style="text-align: center; color: var(--text-muted); margin-top: 40px;">Loading Database...</p>
    </main>

    <script>
        let dbData = null;
        const container = document.getElementById('database-container');

        async function loadDatabase() {
            try {
                const response = await fetch('panchapadi_summary_database_2.json');
                if (!response.ok) throw new Error('Network response was not ok');
                dbData = await response.json();
                renderClasses();
            } catch (error) {
                container.innerHTML = `
                    <div class="chapter-card" style="text-align: center; color: var(--text-main);">
                        <div style="font-size: 40px; margin-bottom: 16px;">⚠️</div>
                        <h3>Unable to load database</h3>
                        <p style="text-align: center;">Please ensure <strong>panchapadi_summary_database_2.json</strong> is placed in the same directory and you are running this file through a local web server.</p>
                    </div>
                `;
                console.error("Error loading JSON:", error);
            }
        }

        // View 1: Show Classes
        function renderClasses() {
            window.scrollTo(0, 0);
            let html = `
                <h2 class="section-title">Platform: ${dbData.platform}</h2>
                <h2 class="section-title">Select Class</h2>
                <div class="app-grid">
            `;
            
            dbData.classes.forEach((cls, classIndex) => {
                html += `
                    <div class="app-card" onclick="renderSubjects(${classIndex})">
                        <div class="icon-box grad-blue"><span>🎓</span></div>
                        <h3>${cls.class_name}</h3>
                    </div>
                `;
            });
            
            html += `</div>`;
            container.innerHTML = html;
        }

        // View 2: Show Subjects for a selected Class
        function renderSubjects(classIndex) {
            window.scrollTo(0, 0);
            const cls = dbData.classes[classIndex];
            
            let html = `
                <button class="btn-secondary" onclick="renderClasses()">🔙 Back to Classes</button>
                <h2 class="section-title">${cls.class_name} - Select Subject</h2>
                <div class="app-grid">
            `;
            
            cls.subjects.forEach((subject, subjectIndex) => {
                html += `
                    <div class="app-card" onclick="renderChapters(${classIndex}, ${subjectIndex})">
                        <div class="icon-box grad-purple"><span>📖</span></div>
                        <h3>${subject.subject_name}</h3>
                    </div>
                `;
            });
            
            html += `</div>`;
            container.innerHTML = html;
        }

        // View 3: Show Chapters for a selected Subject
        function renderChapters(classIndex, subjectIndex) {
            window.scrollTo(0, 0);
            const cls = dbData.classes[classIndex];
            const subject = cls.subjects[subjectIndex];
            
            let html = `
                <button class="btn-secondary" onclick="renderSubjects(${classIndex})">🔙 Back to Subjects</button>
                <h2 class="section-title">${subject.subject_name} - Select Chapter</h2>
                <div class="app-grid">
            `;
            
            subject.chapters.forEach((chapter, chapterIndex) => {
                // Use chapter_name if available, otherwise fallback to formatted chapter_id
                const displayName = chapter.chapter_name ? chapter.chapter_name : chapter.chapter_id.replace('-', ' ');
                const displayId = chapter.chapter_name ? chapter.chapter_id.replace('-', ' ') : '';
                
                html += `
                    <div class="app-card" onclick="renderSummary(${classIndex}, ${subjectIndex}, ${chapterIndex})">
                        <div class="icon-box grad-green"><span>📝</span></div>
                        <h3>${displayName}</h3>
                        ${displayId ? `<p>${displayId}</p>` : ''}
                    </div>
                `;
            });
            
            html += `</div>`;
            container.innerHTML = html;
        }

        // View 4: Show the actual Summary for a selected Chapter
        function renderSummary(classIndex, subjectIndex, chapterIndex) {
            window.scrollTo(0, 0);
            const chapter = dbData.classes[classIndex].subjects[subjectIndex].chapters[chapterIndex];
            const displayName = chapter.chapter_name || chapter.chapter_id.replace('-', ' ');
            const displayId = chapter.chapter_name ? chapter.chapter_id.replace('-', ' ') : '';
            
            let html = `
                <button class="btn-secondary" onclick="renderChapters(${classIndex}, ${subjectIndex})">🔙 Back to Chapters</button>
                <div class="chapter-card">
                    <div class="chapter-header">
                        <div class="chapter-header-top">
                            <div class="chapter-title">${displayName}</div>
                            <div class="chapter-badge">Summary</div>
                        </div>
                        ${displayId ? `<div class="chapter-subtitle">${displayId}</div>` : ''}
                    </div>
                    <div class="chapter-summary">
            `;
            
            chapter.content_data.summary.forEach(paragraph => {
                html += `<p>${paragraph}</p>`;
            });
            
            html += `
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', loadDatabase);
    </script>
</body>
</html>
