<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ଆଜିର ଖବର</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Oriya:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink:       #1a1a2e;
            --crimson:   #c0392b;
            --crimson-dk:#96281b;
            --saffron:   #e67e22;
            --paper:     #faf7f2;
            --surface:   #ffffff;
            --muted:     #6b7280;
            --border:    #e5e0d8;
            --tab-h:     52px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Noto Sans Oriya', 'Inter', sans-serif;
            background: var(--paper);
            color: var(--ink);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* ── MASTHEAD ── */
        .masthead {
            background: var(--crimson);
            color: #fff;
            padding: 18px 20px 0;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,.18);
        }
        .masthead-title {
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 700;
            letter-spacing: .5px;
            margin: 0 0 4px;
        }
        .masthead-date {
            font-size: .88rem;
            opacity: .85;
            margin-bottom: 14px;
        }

        /* ── TABS ── */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 4px;
            padding-bottom: 0;
        }
        .tab-btn {
            height: var(--tab-h);
            padding: 0 22px;
            border: none;
            background: rgba(255,255,255,.15);
            color: rgba(255,255,255,.8);
            font-family: inherit;
            font-size: .95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: background .18s, color .18s;
            white-space: nowrap;
        }
        .tab-btn:hover { background: rgba(255,255,255,.25); color: #fff; }
        .tab-btn.active {
            background: var(--paper);
            color: var(--crimson);
        }
        .tab-icon { margin-right: 6px; }

        /* ── LANG ROW ── */
        .lang-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
            background: var(--border);
            padding: 6px 20px;
            border-bottom: 1px solid #d5cfc7;
            font-size: .8rem;
            color: var(--muted);
        }
        .lang-pill {
            padding: 3px 12px;
            border-radius: 12px;
            border: 1px solid var(--crimson);
            background: transparent;
            color: var(--crimson);
            font-size: .8rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: .15s;
        }
        .lang-pill.active { background: var(--crimson); color: #fff; }

        /* ── PANEL ── */
        .panel-wrap {
            max-width: 820px;
            margin: 28px auto;
            padding: 0 16px 60px;
        }
        .panel { display: none; }
        .panel.active { display: block; }

        /* ── NEWS CARD ── */
        .news-card {
            background: var(--surface);
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,.07);
            overflow: hidden;
        }
        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 2px solid var(--border);
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--crimson);
            margin: 0;
        }
        .source-tag {
            font-size: .72rem;
            background: #fef3c7;
            color: #92400e;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: 600;
        }
        .refresh-btn {
            width: 34px; height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--paper);
            color: var(--muted);
            font-size: 1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: .2s;
            flex-shrink: 0;
        }
        .refresh-btn:hover { background: var(--crimson); color: #fff; border-color: var(--crimson); }
        .refresh-btn.spinning { animation: spin .7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .card-body { padding: 6px 20px 20px; }

        /* ── STATUS STATES ── */
        .state-idle, .state-loading, .state-error {
            text-align: center;
            padding: 36px 20px;
            color: var(--muted);
            font-size: .95rem;
            line-height: 1.7;
        }
        .state-loading { color: var(--saffron); }
        .state-error   { color: var(--crimson); }

        /* ── NEWS LIST ── */
        .news-list {
            list-style: none;
            margin: 0;
            padding: 0;
            counter-reset: news;
        }
        .news-item {
            display: flex;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            counter-increment: news;
        }
        .news-item:last-child { border-bottom: none; }
        .news-num {
            flex-shrink: 0;
            width: 26px; height: 26px;
            border-radius: 50%;
            background: var(--crimson);
            color: #fff;
            font-size: .75rem;
            font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            margin-top: 2px;
        }
        .news-text { flex: 1; }
        .news-headline {
            display: block;
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.55;
            color: var(--ink);
            text-decoration: none;
        }
        .news-headline:hover { color: var(--crimson); }
        .news-meta {
            font-size: .75rem;
            color: var(--muted);
            margin-top: 4px;
        }

        /* ── LOAD MORE BTN ── */
        .load-more-btn {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            background: var(--crimson);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .18s;
        }
        .load-more-btn:hover { background: var(--crimson-dk); }
        .load-more-btn:disabled { background: #9ca3af; cursor: not-allowed; }

        /* ── FOOTER ── */
        .footer {
            text-align: center;
            padding: 18px;
            font-size: .78rem;
            color: var(--muted);
            background: var(--border);
            border-top: 1px solid #d5cfc7;
        }

        @media (max-width: 500px) {
            .tab-btn { padding: 0 12px; font-size: .85rem; }
            .masthead-title { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

<header class="masthead">
    <div class="masthead-title">📰 ଆଜିର ଖବର</div>
    <div class="masthead-date" id="dateDisplay"></div>
    <nav class="tabs">
        <button class="tab-btn active" data-tab="rajya" onclick="switchTab('rajya', this)">
            <span class="tab-icon">📍</span><span class="tab-label">ରାଜ୍ୟ ଖବର</span>
        </button>
        <button class="tab-btn" data-tab="jatiya" onclick="switchTab('jatiya', this)">
            <span class="tab-icon">🇮🇳</span><span class="tab-label">ଜାତୀୟ ଖବର</span>
        </button>
        <button class="tab-btn" data-tab="bishwa" onclick="switchTab('bishwa', this)">
            <span class="tab-icon">🌍</span><span class="tab-label">ବିଶ୍ୱ ଖବର</span>
        </button>
    </nav>
</header>

<div class="lang-row">
    <span>ଭାଷା:</span>
    <button class="lang-pill active" id="pill-or" onclick="setLang('or')">ଓଡ଼ିଆ</button>
    <button class="lang-pill"        id="pill-en" onclick="setLang('en')">English</button>
</div>

<div class="panel-wrap">

    <!-- RAJYA (Odisha) -->
    <div class="panel active" id="panel-rajya">
        <div class="news-card">
            <div class="card-top">
                <h2 class="card-title" id="rajya-title">📍 ରାଜ୍ୟ ଖବର</h2>
                <div style="display:flex;align-items:center;gap:10px;">
                    <span class="source-tag" id="rajya-source">Pragativadi</span>
                    <button class="refresh-btn" id="refresh-rajya" onclick="forceRefresh('rajya')" title="ପୁଣି ଲୋଡ଼ କରନ୍ତୁ">🔄</button>
                </div>
            </div>
            <div class="card-body">
                <div id="rajya-result"><div class="state-loading">⏳ ଖବର ଅଣାଯାଉଛି...</div></div>
            </div>
        </div>
    </div>

    <!-- JATIYA (National) -->
    <div class="panel" id="panel-jatiya">
        <div class="news-card">
            <div class="card-top">
                <h2 class="card-title" id="jatiya-title">🇮🇳 ଜାତୀୟ ଖବର</h2>
                <div style="display:flex;align-items:center;gap:10px;">
                    <span class="source-tag">NDTV</span>
                    <button class="refresh-btn" id="refresh-jatiya" onclick="forceRefresh('jatiya')" title="ପୁଣି ଲୋଡ଼ କରନ୍ତୁ">🔄</button>
                </div>
            </div>
            <div class="card-body">
                <div id="jatiya-result"><div class="state-idle" id="jatiya-idle">ଖବର ଦେଖିବା ପାଇଁ ନିଚ ବଟନ୍ ଦବାନ୍ତୁ।</div></div>
                <button class="load-more-btn" id="btn-jatiya" onclick="loadNews('jatiya')">
                    ୧୦ଟି ଜାତୀୟ ଖବର ଆଣନ୍ତୁ
                </button>
            </div>
        </div>
    </div>

    <!-- BISHWA (World) -->
    <div class="panel" id="panel-bishwa">
        <div class="news-card">
            <div class="card-top">
                <h2 class="card-title" id="bishwa-title">🌍 ବିଶ୍ୱ ଖବର</h2>
                <div style="display:flex;align-items:center;gap:10px;">
                    <span class="source-tag">BBC</span>
                    <button class="refresh-btn" id="refresh-bishwa" onclick="forceRefresh('bishwa')" title="ପୁଣି ଲୋଡ଼ କରନ୍ତୁ">🔄</button>
                </div>
            </div>
            <div class="card-body">
                <div id="bishwa-result"><div class="state-idle" id="bishwa-idle">ଖବର ଦେଖିବା ପାଇଁ ନିଚ ବଟନ୍ ଦବାନ୍ତୁ।</div></div>
                <button class="load-more-btn" id="btn-bishwa" onclick="loadNews('bishwa')">
                    ୧୦ଟି ବିଶ୍ୱ ଖବର ଆଣନ୍ତୁ
                </button>
            </div>
        </div>
    </div>

</div>

<footer class="footer" id="footer-txt">
    ରାଜ୍ୟ: Pragativadi (ଓଡ଼ିଆ) · ଜାତୀୟ: NDTV India · ବିଶ୍ୱ: BBC World
</footer>

<script>
// ────────────────────────────────────────────────
// CONFIG
// ────────────────────────────────────────────────
const RSS2JSON = 'https://api.rss2json.com/v1/api.json?rss_url=';
const ANTHROPIC = 'https://api.anthropic.com/v1/messages';

const SOURCES = {
    rajya: {
        // Odia RSS feeds tried in order — native Odia, no translation needed
        feeds: [
            'https://pragativadi.com/feed/',
            'https://pragativadi.com/category/odisha/feed/',
            'https://sambad.in/feed/',
        ],
        nativeOdia: true,
        titleOr: '📍 ରାଜ୍ୟ ଖବର',
        titleEn: '📍 Odisha (State) News',
        btnOr:   'ଓଡ଼ିଶା ଖବର ପୁଣି ଆଣନ୍ତୁ',
        btnEn:   'Reload Odisha News',
    },
    jatiya: {
        feeds: [
            'https://feeds.feedburner.com/ndtvnews-india-news',
            'https://timesofindia.indiatimes.com/rssfeeds/-2128936835.cms',
        ],
        nativeOdia: false,
        titleOr: '🇮🇳 ଜାତୀୟ ଖବର',
        titleEn: '🇮🇳 National News',
        btnOr:   '୧୦ଟି ଜାତୀୟ ଖବର ଆଣନ୍ତୁ',
        btnEn:   'Load 10 National News',
    },
    bishwa: {
        feeds: [
            'https://feeds.bbci.co.uk/news/world/rss.xml',
            'https://rss.nytimes.com/services/xml/rss/nyt/World.xml',
        ],
        nativeOdia: false,
        titleOr: '🌍 ବିଶ୍ୱ ଖବର',
        titleEn: '🌍 World News',
        btnOr:   '୧୦ଟି ବିଶ୍ୱ ଖବର ଆଣନ୍ତୁ',
        btnEn:   'Load 10 World News',
    },
};

// ────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────
let lang      = 'or';
let activeTab = 'rajya';
const loaded  = { rajya: false, jatiya: false, bishwa: false };
const today   = new Date();
const todayKey = today.toDateString();

// ────────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────────
(function init() {
    updateDate();
    updateStaticLabels();
    loadNews('rajya');   // auto-load rajya on open
})();

function updateDate() {
    const days_or = ['ରବିବାର','ସୋମବାର','ମଙ୍ଗଳବାର','ବୁଧବାର','ଗୁରୁବାର','ଶୁକ୍ରବାର','ଶନିବାର'];
    const days_en = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const dateStr = today.toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' });
    const dayName = lang === 'or' ? days_or[today.getDay()] : days_en[today.getDay()];
    document.getElementById('dateDisplay').textContent =
        lang === 'or' ? `${dateStr} · ${dayName}` : `${dateStr} · ${dayName}`;
}

function updateStaticLabels() {
    // Tab labels
    document.querySelectorAll('.tab-btn').forEach(btn => {
        const tab = btn.dataset.tab;
        const src = SOURCES[tab];
        const icons = { rajya:'📍', jatiya:'🇮🇳', bishwa:'🌍' };
        btn.querySelector('.tab-label').textContent =
            lang === 'or' ? src.titleOr.replace(/^[^\s]+\s/,'') : src.titleEn.replace(/^[^\s]+\s/,'');
    });

    // Card titles
    ['rajya','jatiya','bishwa'].forEach(tab => {
        const src = SOURCES[tab];
        const el = document.getElementById(`${tab}-title`);
        if (el) el.textContent = lang === 'or' ? src.titleOr : src.titleEn;

        const btn = document.getElementById(`btn-${tab}`);
        if (btn) {
            btn.textContent = lang === 'or' ? src.btnOr : src.btnEn;
        }

        // idle messages
        const idle = document.getElementById(`${tab}-idle`);
        if (idle) idle.textContent = lang === 'or'
            ? 'ଖବର ଦେଖିବା ପାଇଁ ନିଚ ବଟନ୍ ଦବାନ୍ତୁ।'
            : 'Press the button below to load news.';
    });

    document.getElementById('footer-txt').textContent = lang === 'or'
        ? 'ରାଜ୍ୟ: Pragativadi (ଓଡ଼ିଆ) · ଜାତୀୟ: NDTV India · ବିଶ୍ୱ: BBC World'
        : 'State: Pragativadi (Odia) · National: NDTV India · World: BBC World';
}

// ────────────────────────────────────────────────
// TAB SWITCHING
// ────────────────────────────────────────────────
function switchTab(tab, el) {
    // Update tab UI
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');

    // Show panel
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById(`panel-${tab}`).classList.add('active');

    activeTab = tab;

    // Auto-load rajya; others load on demand (unless already loaded)
    if (tab === 'rajya' && !loaded.rajya) {
        loadNews('rajya');
    }
}

// ────────────────────────────────────────────────
// LANG SWITCH
// ────────────────────────────────────────────────
function setLang(l) {
    if (lang === l) return;
    lang = l;
    document.getElementById('pill-or').classList.toggle('active', l === 'or');
    document.getElementById('pill-en').classList.toggle('active', l === 'en');
    updateDate();
    updateStaticLabels();

    // Clear cached renders and reload active tab
    Object.keys(loaded).forEach(k => loaded[k] = false);
    ['rajya','jatiya','bishwa'].forEach(tab => {
        const el = document.getElementById(`${tab}-result`);
        if (!el) return;
        const isRajya = tab === 'rajya';
        if (isRajya) {
            el.innerHTML = `<div class="state-loading">⏳ ${lang === 'or' ? 'ଖବର ଅଣାଯାଉଛି...' : 'Loading news...'}</div>`;
        } else {
            el.innerHTML = `<div class="state-idle" id="${tab}-idle">${lang === 'or' ? 'ଖବର ଦେଖିବା ପାଇଁ ନିଚ ବଟନ୍ ଦବାନ୍ତୁ।' : 'Press the button below to load news.'}</div>`;
        }
        const btn = document.getElementById(`btn-${tab}`);
        if (btn) btn.disabled = false;
    });

    loadNews('rajya'); // reload rajya automatically
}

// ────────────────────────────────────────────────
// FORCE REFRESH (clears cache)
// ────────────────────────────────────────────────
function forceRefresh(tab) {
    const cacheKey = `news_${tab}_${lang}_${todayKey}`;
    try { localStorage.removeItem(cacheKey); } catch(e) {}
    loaded[tab] = false;
    loadNews(tab);
}

// ────────────────────────────────────────────────
// FETCH RSS via rss2json with fallback feeds
// ────────────────────────────────────────────────
async function fetchRSS(feeds) {
    for (const feed of feeds) {
        try {
            const url = `${RSS2JSON}${encodeURIComponent(feed)}&count=12`;
            const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
            if (!res.ok) continue;
            const data = await res.json();
            if (data.status === 'ok' && Array.isArray(data.items) && data.items.length > 0) {
                return data.items;
            }
        } catch(e) { /* try next */ }
    }
    return null;
}

// ────────────────────────────────────────────────
// CLAUDE TRANSLATION (batched, much better quality)
// ────────────────────────────────────────────────
async function translateBatch(titles) {
    // If English mode, no translation
    if (lang === 'en') return titles;

    const numbered = titles.map((t, i) => `${i+1}. ${t}`).join('\n');
    const prompt = `You are a professional Odia (Oriya) translator. Translate the following English news headlines to natural, fluent Odia (ଓଡ଼ିଆ script). Keep proper nouns like names of countries and people in a recognizable form. Output ONLY the translated lines numbered the same way, no extra text.\n\n${numbered}`;

    try {
        const res = await fetch(ANTHROPIC, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: 'claude-sonnet-4-6',
                max_tokens: 1000,
                messages: [{ role: 'user', content: prompt }]
            }),
            signal: AbortSignal.timeout(20000)
        });
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        const text = data.content?.find(b => b.type === 'text')?.text || '';
        // Parse numbered lines back
        const lines = text.trim().split('\n');
        const translated = [];
        for (let i = 0; i < titles.length; i++) {
            // Try to find line starting with i+1.
            const match = lines.find(l => l.match(new RegExp(`^${i+1}[.\\)]\s*`)));
            if (match) {
                translated.push(match.replace(/^\d+[.)]\s*/, '').trim());
            } else {
                translated.push(titles[i]); // fallback to original
            }
        }
        return translated;
    } catch(e) {
        return titles; // fallback: show English
    }
}

// ────────────────────────────────────────────────
// MAIN LOAD FUNCTION
// ────────────────────────────────────────────────
async function loadNews(tab) {
    const src    = SOURCES[tab];
    const result = document.getElementById(`${tab}-result`);
    const btn    = document.getElementById(`btn-${tab}`);
    const rfBtn  = document.getElementById(`refresh-${tab}`);

    if (!result) return;

    // Check cache
    const cacheKey = `news_${tab}_${lang}_${todayKey}`;
    try {
        const cached = localStorage.getItem(cacheKey);
        if (cached) {
            result.innerHTML = cached;
            loaded[tab] = true;
            if (btn) btn.disabled = false;
            return;
        }
    } catch(e) {}

    // Set loading state
    if (btn) btn.disabled = true;
    if (rfBtn) rfBtn.classList.add('spinning');
    result.innerHTML = `<div class="state-loading">⏳ ${lang === 'or' ? 'ଖବର ଅଣାଯାଉଛି...' : 'Fetching news...'}</div>`;

    try {
        const items = await fetchRSS(src.feeds);
        if (!items) throw new Error('All feeds failed');

        const articles = items.slice(0, 10);
        let titles = articles.map(a => {
            // Strip source suffix e.g. "Headline - NDTV"
            return (a.title || '').split(' - ')[0].replace(/<[^>]+>/g, '').trim();
        });

        // Translation: rajya is native Odia — no translation needed
        // For national/world: translate only in Odia mode
        let finalTitles = titles;
        if (!src.nativeOdia && lang === 'or') {
            finalTitles = await translateBatch(titles);
        } else if (src.nativeOdia && lang === 'en') {
            // For rajya in English mode — translate Odia → English
            // We show the Odia title but note it's Odia; simpler: keep original
            finalTitles = titles; // Odia RSS titles are already Odia; show as-is in English mode too
        }

        // Build HTML
        let html = '<ul class="news-list">';
        articles.forEach((article, i) => {
            const pubDate = article.pubDate
                ? new Date(article.pubDate).toLocaleDateString('en-IN', { day:'numeric', month:'short' })
                : '';
            html += `
            <li class="news-item">
                <div class="news-num">${i + 1}</div>
                <div class="news-text">
                    <a class="news-headline" href="${article.link || '#'}" target="_blank" rel="noopener">
                        ${escHtml(finalTitles[i] || titles[i])}
                    </a>
                    ${pubDate ? `<div class="news-meta">${pubDate}</div>` : ''}
                </div>
            </li>`;
        });
        html += '</ul>';

        result.innerHTML = html;
        loaded[tab] = true;

        try { localStorage.setItem(cacheKey, html); } catch(e) {}

    } catch(err) {
        result.innerHTML = `<div class="state-error">
            ❌ ${lang === 'or'
                ? 'ଖବର ଆଣିବାରେ ତ୍ରୁଟି। ଇଣ୍ଟରନେଟ ଯାଞ୍ଚ କରି ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।'
                : 'Error loading news. Check your connection and try again.'}
        </div>`;
    } finally {
        if (btn) btn.disabled = false;
        if (rfBtn) rfBtn.classList.remove('spinning');
    }
}

function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
