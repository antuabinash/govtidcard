<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ଆଜିର ଖବର - Daily News</title>
    
    <!-- Fonts & PWA Meta Tags -->
    <meta name="theme-color" content="#F4F6F9">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Oriya:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* === App Variables & Reset (From your provided CSS) === */
        :root {
            --app-bg: #F4F6F9;
            --card-bg: #FFFFFF;
            --text-main: #1D1D1F;
            --text-muted: #86868B;
            --primary: #007AFF;
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.04);
            --safe-area-pt: env(safe-area-inset-top, 16px);
            --safe-area-pb: env(safe-area-inset-bottom, 20px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Noto Sans Oriya', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--app-bg); 
            color: var(--text-main); 
            line-height: 1.5; 
            padding-bottom: calc(40px + var(--safe-area-pb)); 
            overflow-x: hidden; 
        }

        /* === Header === */
        header { 
            padding: calc(var(--safe-area-pt) + 12px) 24px 12px 24px; 
            background: rgba(244, 246, 249, 0.85); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); 
            position: sticky; top: 0; z-index: 100; 
            border-bottom: 1px solid rgba(0,0,0,0.03); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .back-btn {
            width: 40px; height: 40px; border-radius: 50%; 
            background: #FFFFFF; display: flex; align-items: center; justify-content: center; 
            color: var(--text-main); text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-size: 18px; font-weight: bold;
        }
        .app-title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-main); margin: 0; }
        .greeting { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-top: -2px; }

        /* === Utilities === */
        .container { max-width: 800px; margin: 0 auto; padding: 20px 24px; }
        
        .date-display {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* === iOS Style Language Switcher === */
        .lang-switch {
            display: flex;
            background: #E3E3E8;
            border-radius: 12px;
            padding: 4px;
            margin: 0 auto 24px auto;
            max-width: 300px;
        }
        .lang-btn {
            flex: 1;
            padding: 8px 12px;
            border-radius: 10px;
            border: none;
            background: transparent;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            font-family: inherit;
        }
        .lang-btn.active {
            background: #fff;
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* === News Cards === */
        .news-card {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(0,0,0,0.02);
        }
        
        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .card-header-row h2 { 
            margin: 0; 
            font-size: 1.25rem; 
            font-weight: 800;
            color: var(--text-main);
        }

        .refresh-btn {
            background: #F4F6F9;
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: transform 0.3s ease, background 0.2s;
        }
        .refresh-btn:hover {
            background: #E3E3E8;
            color: var(--text-main);
        }
        .refresh-btn:active { transform: rotate(90deg) scale(0.9); }
        
        .load-btn { 
            width: 100%; 
            padding: 14px; 
            border-radius: var(--radius-md); 
            border: none; 
            background-color: var(--primary); 
            color: white; 
            font-size: 15px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: transform 0.2s, opacity 0.2s; 
            font-family: inherit;
            margin-bottom: 16px;
        }
        .load-btn:active { transform: scale(0.98); }
        .load-btn:disabled { background-color: var(--text-muted); opacity: 0.7; cursor: not-allowed; }
        
        .result-box { 
            font-size: 15px; 
            line-height: 1.6; 
        }
        
        /* News List Styling */
        .news-list { list-style: none; padding: 0; margin: 0; }
        .news-list li { 
            padding: 12px 0; 
            border-bottom: 1px solid rgba(0,0,0,0.04); 
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .news-list li:last-child { border-bottom: none; padding-bottom: 0; }
        .news-num {
            background: rgba(0, 122, 255, 0.1);
            color: var(--primary);
            font-weight: 700;
            font-size: 13px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .news-list a { color: var(--text-main); text-decoration: none; font-weight: 500; }
        .news-list a:hover { color: var(--primary); text-decoration: underline; }
        
        .loading-text {
            text-align: center;
            color: var(--text-muted);
            font-weight: 500;
            padding: 20px 0;
        }
        .spinner { animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <a href="index.html" class="back-btn">←</a>
            <div>
                <div class="greeting">Daily Updates</div>
                <h1 class="app-title">ଆଜିର ଖବର</h1>
            </div>
        </div>
    </header>
    
    <div class="container">
        
        <!-- Language Switcher -->
        <div class="lang-switch">
            <button id="lang-or" class="lang-btn active" onclick="setLanguage('or')">ଓଡ଼ିଆ</button>
            <button id="lang-en" class="lang-btn" onclick="setLanguage('en')">English</button>
        </div>

        <div class="date-display" id="dateDisplay"></div>

        <!-- SECTION 1: ODISHA NEWS -->
        <div class="news-card">
            <div class="card-header-row">
                <h2 id="title-odisha">📍 ରାଜ୍ୟ ଖବର (Odisha)</h2>
                <button class="refresh-btn" onclick="forceRefresh('https://pragativadi.com/category/odisha/feed/', 'odishaResult', 'btn-odisha', 'cache_news_odisha')" title="Refresh">🔄</button>
            </div>
            <button id="btn-odisha" class="load-btn" onclick="loadCategoryNews('https://pragativadi.com/category/odisha/feed/', 'odishaResult', 'btn-odisha', 'cache_news_odisha')">
                ୧୦ଟି ରାଜ୍ୟ ଖବର ଆଣନ୍ତୁ
            </button>
            <div id="odishaResult" class="result-box">
                <div class="loading-text" id="msg-odisha">ଖବର ଦେଖିବା ପାଇଁ ଉପର ବଟନ୍ ଦବାନ୍ତୁ।</div>
            </div>
        </div>

        <!-- SECTION 2: NATIONAL NEWS -->
        <div class="news-card">
            <div class="card-header-row">
                <h2 id="title-national">🇮🇳 ଜାତୀୟ ଖବର (National)</h2>
                <button class="refresh-btn" onclick="forceRefresh('https://feeds.feedburner.com/ndtvnews-india-news', 'nationalResult', 'btn-national', 'cache_news_national')" title="Refresh">🔄</button>
            </div>
            <button id="btn-national" class="load-btn" onclick="loadCategoryNews('https://feeds.feedburner.com/ndtvnews-india-news', 'nationalResult', 'btn-national', 'cache_news_national')">
                ୧୦ଟି ଜାତୀୟ ଖବର ଆଣନ୍ତୁ
            </button>
            <div id="nationalResult" class="result-box">
                <div class="loading-text" id="msg-national">ଖବର ଦେଖିବା ପାଇଁ ଉପର ବଟନ୍ ଦବାନ୍ତୁ।</div>
            </div>
        </div>

        <!-- SECTION 3: INTERNATIONAL NEWS -->
        <div class="news-card">
            <div class="card-header-row">
                <h2 id="title-intl">🌍 ବିଶ୍ୱ ଖବର (International)</h2>
                <button class="refresh-btn" onclick="forceRefresh('https://feeds.bbci.co.uk/news/world/rss.xml', 'internationalResult', 'btn-intl', 'cache_news_intl')" title="Refresh">🔄</button>
            </div>
            <button id="btn-intl" class="load-btn" onclick="loadCategoryNews('https://feeds.bbci.co.uk/news/world/rss.xml', 'internationalResult', 'btn-intl', 'cache_news_intl')">
                ୧୦ଟି ବିଶ୍ୱ ଖବର ଆଣନ୍ତୁ
            </button>
            <div id="internationalResult" class="result-box">
                <div class="loading-text" id="msg-intl">ଖବର ଦେଖିବା ପାଇଁ ଉପର ବଟନ୍ ଦବାନ୍ତୁ।</div>
            </div>
        </div>

    </div>

    <script>
        // --- State Variables ---
        let currentLang = 'or'; 
        
        const daysOdia = ["ରବିବାର", "ସୋମବାର", "ମଙ୍ଗଳବାର", "ବୁଧବାର", "ଗୁରୁବାର", "ଶୁକ୍ରବାର", "ଶନିବାର"];
        const daysEng = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        
        const today = new Date();
        const todayKey = today.toDateString();

        // Initialize Date
        function updateDateDisplay() {
            const dateStr = today.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
            if (currentLang === 'or') {
                document.getElementById('dateDisplay').innerText = `ଆଜି: ${dateStr} · ${daysOdia[today.getDay()]}`;
            } else {
                document.getElementById('dateDisplay').innerText = `Today: ${dateStr} · ${daysEng[today.getDay()]}`;
            }
        }
        updateDateDisplay();

        // --- Language Switcher Logic ---
        function setLanguage(lang) {
            currentLang = lang;
            
            // Toggle Active Button
            document.getElementById('lang-or').classList.toggle('active', lang === 'or');
            document.getElementById('lang-en').classList.toggle('active', lang === 'en');
            
            // Update UI Text
            updateDateDisplay();
            
            if (lang === 'or') {
                document.getElementById('title-odisha').innerText = "📍 ରାଜ୍ୟ ଖବର (Odisha)";
                document.getElementById('title-national').innerText = "🇮🇳 ଜାତୀୟ ଖବର (National)";
                document.getElementById('title-intl').innerText = "🌍 ବିଶ୍ୱ ଖବର (International)";
                
                document.getElementById('btn-odisha').innerText = "୧୦ଟି ରାଜ୍ୟ ଖବର ଆଣନ୍ତୁ";
                document.getElementById('btn-national').innerText = "୧୦ଟି ଜାତୀୟ ଖବର ଆଣନ୍ତୁ";
                document.getElementById('btn-intl').innerText = "୧୦ଟି ବିଶ୍ୱ ଖବର ଆଣନ୍ତୁ";
            } else {
                document.getElementById('title-odisha').innerText = "📍 State News (Odisha)";
                document.getElementById('title-national').innerText = "🇮🇳 National News";
                document.getElementById('title-intl').innerText = "🌍 World News";

                document.getElementById('btn-odisha').innerText = "Load 10 State News";
                document.getElementById('btn-national').innerText = "Load 10 National News";
                document.getElementById('btn-intl').innerText = "Load 10 World News";
            }

            // Clear the feed boxes to force a fresh click in the new language
            document.querySelectorAll('.result-box').forEach(box => {
                box.innerHTML = `<div class="loading-text">${lang === 'or' ? 'ଖବର ଦେଖିବା ପାଇଁ ଉପର ବଟନ୍ ଦବାନ୍ତୁ।' : 'Tap the button above to load news.'}</div>`;
            });
            document.querySelectorAll('.load-btn').forEach(btn => btn.disabled = false);
        }

        // --- Translation Engine (with graceful timeout fallback) ---
        async function translateToOdia(text) {
            try {
                const cleanText = text.replace(/<[^>]*>?/gm, '').trim();
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4500); // 4.5s max for translation

                const response = await fetch(
                    `https://api.mymemory.translated.net/get?q=${encodeURIComponent(cleanText)}&langpair=en|or`,
                    { signal: controller.signal }
                );
                clearTimeout(timeoutId);
                const data = await response.json();
                return data.responseData?.translatedText || cleanText;
            } catch(e) {
                return text; // Return English original if translation times out or fails
            }
        }

        // --- Manual Refresh Function ---
        function forceRefresh(rssFeedUrl, containerId, btnId, baseCacheKey) {
            const langCacheKey = `${baseCacheKey}_${currentLang}`;
            localStorage.removeItem(langCacheKey);
            localStorage.removeItem(`${langCacheKey}_date`);
            loadCategoryNews(rssFeedUrl, containerId, btnId, baseCacheKey);
        }

        // --- Main Fetch Engine (No strict fetch timeout) ---
        async function loadCategoryNews(rssFeedUrl, containerId, btnId, baseCacheKey) {
            const box = document.getElementById(containerId);
            const btn = document.getElementById(btnId);
            const langCacheKey = `${baseCacheKey}_${currentLang}`;

            // 1. Check Local Cache
            const cachedDate = localStorage.getItem(`${langCacheKey}_date`);
            const cachedHTML = localStorage.getItem(langCacheKey);

            if (cachedDate === todayKey && cachedHTML) {
                box.innerHTML = cachedHTML;
                return;
            }

            // 2. Set UI to Loading
            btn.disabled = true;
            box.innerHTML = `<div class="loading-text" style="color: var(--primary);">
                                <span class="spinner">⏳</span> ${currentLang === 'or' ? 'ଖବର ଅଣାଯାଉଛି (Syncing)...' : 'Fetching latest news...'}
                             </div>`;

            try {
                // Fetching RSS directly without AbortSignal timeout to prevent random cutoffs
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssFeedUrl)}`;
                const res = await fetch(apiUrl);
                const data = await res.json();

                if (data.status !== "ok" || !data.items) throw new Error("Feed error");

                const maxItems = Math.min(10, data.items.length);
                const itemsToProcess = data.items.slice(0, maxItems);

                // 3. Process Headlines (Translate only if necessary)
                const processingPromises = itemsToProcess.map(async (article) => {
                    let cleanTitle = article.title.split(' - ')[0].trim();
                    let finalTitle = (currentLang === 'or') ? await translateToOdia(cleanTitle) : cleanTitle;
                    return { link: article.link, title: finalTitle };
                });

                const finalArticles = await Promise.all(processingPromises);

                // 4. Render and Cache HTML
                let html = '<ul class="news-list">';
                finalArticles.forEach((item, index) => {
                    html += `
                        <li>
                            <div class="news-num">${index + 1}</div>
                            <a href="${item.link}" target="_blank" rel="noopener">${item.title}</a>
                        </li>`;
                });
                html += "</ul>";

                box.innerHTML = html;
                localStorage.setItem(langCacheKey, html);
                localStorage.setItem(`${langCacheKey}_date`, todayKey);

            } catch (error) {
                box.innerHTML = `<div class="loading-text" style="color: #FF3B30;">
                                    ❌ ${currentLang === 'or' ? 'ଖବର ଆଣିବାରେ ତ୍ରୁଟି ହେଲା। ଦୟାକରି ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।' : 'Error loading news. Please try again.'}
                                 </div>`;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
